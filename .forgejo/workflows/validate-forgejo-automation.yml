---
name: Validate Forgejo automation

on:
  pull_request:
    paths:
      - .forgejo/workflows/**
      - .github/scripts/**


jobs:
  validate:
    name: Validate workflows and scripts
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Validate workflow YAML
        run: ruby -ryaml -e "Dir['.forgejo/workflows/*.{yml,yaml}'].each { |path| YAML.load_file(path); puts \"YAML OK #{path}\" }"


      - name: Check Ruby script syntax
        run: |
          for script in .github/scripts/*.rb .github/scripts/lib/*.rb; do
            ruby -c "$script"
          done

      - name: Test Ruby libraries
        run: ruby .github/scripts/test/lib_test.rb
