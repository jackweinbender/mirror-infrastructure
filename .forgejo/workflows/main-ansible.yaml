---
name: Ansible Playbook

on:
  schedule:
    - cron: 0 4 * * *
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ansible/**

# Only let one of these workflows run at a time
concurrency:
  group: main
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./ansible

jobs:
  playbook:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Load secret
        uses: https://github.com/1Password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONE_PASSWORD_SA_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://network/tailscale-oauth-github-actions/client-id
          TS_OAUTH_CLIENT_SECRET: op://network/tailscale-oauth-github-actions/client-secret
      - name: Tailscale
        uses: https://github.com/tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: https://data.forgejo.org/actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            **/*requirements.txt
            **/*requirements.yaml
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r ansible-requirements.yaml
      - run: ansible-lint
      - run: ansible-playbook playbooks/workloads.yaml
