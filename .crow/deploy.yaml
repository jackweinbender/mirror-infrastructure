---
# Compose platform deployment — deploys docker-networking to every deploy host.
# Other stack workflows depend on this to ensure the proxy network exists.
name: Compose platform deployment
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      include:
        - 'compose-stacks/docker-networking/**'
        - 'ansible/inventory.yaml'
        - 'scripts/deploy-stack.sh'
        - 'scripts/deploy-all-hosts.sh'
        - 'scripts/setup-ssh.sh'
        - 'scripts/merge-dotenv.rb'
        - '.crow/deploy.yaml'
  - event: manual
  - event: cron
    cron: deploy
steps:
  - name: preflight
    image: forgejo.weinbender.io/labs/ci-base:main
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - ruby scripts/preflight.rb
  - name: deploy-platform
    image: forgejo.weinbender.io/labs/ci-base:main
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OP_SERVICE_ACCOUNT_TOKEN:
        from_secret: ONE_PASSWORD_SA_TOKEN
      TS_OAUTH_CLIENT_SECRET:
        from_secret: TS_OAUTH_CLIENT_SECRET
    commands:
      - bash scripts/setup-ssh.sh
      - bash scripts/deploy-all-hosts.sh docker-networking

# Configure the existing 05:00 UTC schedule as a Crow cron named `deploy`.
# Other stack workflows depend on this workflow. Pull requests never deploy.
# Required Crow repository secrets: ONE_PASSWORD_SA_TOKEN,
# TS_OAUTH_CLIENT_SECRET.