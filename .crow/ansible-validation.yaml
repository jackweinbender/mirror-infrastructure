---
name: Ansible validation
when:
  - event: pull_request
    path:
      include: ['ansible/**', '.crow/**', '.forgejo/workflows/**', '.github/workflows/**']
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      include: ['ansible/**', '.crow/**']
  - event: manual
steps:
  - name: ansible-validation
    image: git.weinbender.io/labs/ci-base:main
    commands:
      - cd ansible
      - ansible-lint
      - for playbook in playbooks/*.yaml; do ANSIBLE_CONFIG="$PWD/ansible.cfg" ANSIBLE_ROLES_PATH="$PWD/roles" ansible-playbook "$playbook" --syntax-check; done

# Validation only: no Tailscale access or host changes.

