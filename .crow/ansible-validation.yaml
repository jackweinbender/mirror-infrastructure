---
name: Ansible validation
when:
  - event: pull_request
    path:
      include: ['ansible/**', '.crow/**', '.forgejo/workflows/**', '.github/workflows/**']
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      include: ['ansible/**', '.crow/**']
  - event: manual
steps:
  - name: ansible-validation
    image: git.weinbender.io/labs/ci-base:main
    commands:
      - python3.13 -m venv /tmp/ansible-venv
      - cd ansible
      - /tmp/ansible-venv/bin/pip install -r requirements.txt
      - /tmp/ansible-venv/bin/ansible-galaxy collection install -r ansible-requirements.yaml
      - /tmp/ansible-venv/bin/ansible-lint
      - for playbook in playbooks/*.yaml; do /tmp/ansible-venv/bin/ansible-playbook "$playbook" --syntax-check; done

# Validation only: no Tailscale access or host changes.
