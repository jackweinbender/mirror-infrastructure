---
name: Terraform plan/apply (service account)
when:
  - event: manual
# Manual-only on purpose: this workflow changes infrastructure hosts. Routine
# push/PR validation is covered by .crow/terraform-validation.yaml.
#
# Cloud auth uses static service-account credentials managed as Crow secrets
# (no OIDC/IdP). Credentials are injected only into this step's environment and
# are never written to Git or printed to logs.
#
# Each component in the matrix runs as its own workflow instance (parallel),
# mirroring the component matrix used by the repository's CI validation.
matrix:
  COMPONENT:
    - mgmt
    - aws
    - gcp-remind-me
    - gcp-weinbender-io
    - cloudflare
steps:
  - name: plan-or-apply
    image: git.weinbender.io/labs/ci-base:main
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_terraform_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_terraform_secret_access_key
      AWS_DEFAULT_REGION: us-east-1
      GOOGLE_SA_JSON:
        from_secret: gcp_terraform_sa
      OP_SERVICE_ACCOUNT_TOKEN:
        from_secret: one_password_sa_token
      TF_VAR_cloudflare_zone_id:
        from_secret: cloudflare_zone_id
      TF_VAR_cloudflare_account_id:
        from_secret: cloudflare_account_id
      TERRAFORM_APPLY: "false"
      # NOTE: plain value, not a secret. Crow compiles every from_secret
      # reference at startup and fails the whole pipeline if the secret is
      # missing, so this must stay a literal. Set to "true" to allow apply;
      # otherwise the run is plan-only.
    commands:
      - export TF_PLUGIN_CACHE_DIR=/tmp/terraform-plugin-cache
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      # Write the Google service-account key where Terraform's ADC can read it.
      - printf '%s' "$GOOGLE_SA_JSON" > /tmp/gcp-sa.json
      - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
      # Cloudflare + google-oauth secrets come from 1Password.
      - printf '%s\n' 'CLOUDFLARE_API_TOKEN=op://network/cloudflare-terraform/credential' 'TF_VAR_google_oauth_client_id=op://network/cloudflare-google-oauth/client-id' 'TF_VAR_google_oauth_client_secret=op://network/cloudflare-google-oauth/client-secret' >> .env
      # Run the single component assigned to this matrix instance.
      - |
        op run --no-masking --env-file=.env -- bash -c '
        set -eu
        terraform -chdir="terraform/${COMPONENT}" init -input=false -no-color
        terraform -chdir="terraform/${COMPONENT}" fmt -check
        terraform -chdir="terraform/${COMPONENT}" validate -no-color
        terraform -chdir="terraform/${COMPONENT}" plan -input=false -no-color
        if [ "$TERRAFORM_APPLY" = "true" ]; then
          terraform -chdir="terraform/${COMPONENT}" apply -auto-approve -no-color
        fi
        '
      - rm -f .env /tmp/gcp-sa.json
# Required Crow repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# GOOGLE_SA_JSON (the GCP service-account key for the Terraform identity),
# ONE_PASSWORD_SA_TOKEN (existing), CLOUDFLARE_ZONE_ID, and
# CLOUDFLARE_ACCOUNT_ID. AWS/GCP access runs without OIDC/IdP.
# TERRAFORM_APPLY is a literal flag (not a secret): "true" to allow apply,
# otherwise plan-only.
# Components are enumerated in the matrix (mgmt, aws, gcp-remind-me,
# gcp-weinbender-io, cloudflare); keep in sync with terraform/components.json.
