---
name: Repository validation
when:
  - event: push
  - event: pull_request
  - event: manual
steps:
  - name: validate
    image: git.weinbender.io/labs/ci-base:main
    commands:

      - for script in scripts/*.rb scripts/lib/*.rb; do ruby -c "$script"; done
      - ruby scripts/test/lib_test.rb
      - ruby scripts/preflight.rb
      - git diff --check


# Safe for pull requests because it has no secrets.
