---
name: Terraform validation
when:
  - event: pull_request
    path:
      include: ['terraform/**', '.github/terraform-components.json', '.crow/**', '.forgejo/workflows/**', '.github/workflows/**', '.github/scripts/**']
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      include: ['terraform/**', '.crow/**']
  - event: manual
steps:
  - name: validate-components
    image: git.weinbender.io/labs/ci-base:main
    environment:
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache
    commands:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - ruby .github/scripts/validate-terraform-components.rb
      - for component in aws cloudflare gcp-remind-me gcp-weinbender-io mgmt; do terraform -chdir="terraform/$component" init -backend=false && terraform -chdir="terraform/$component" fmt -check && terraform -chdir="terraform/$component" validate; done

# Plan/apply remains deferred until Crow OIDC and Forge-specific PR comments are confirmed.
