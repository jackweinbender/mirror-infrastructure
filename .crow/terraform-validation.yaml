---
name: Terraform validation
when:
  - event: pull_request
    path:
      include: ['terraform/**', 'terraform/components.json', '.crow/**', 'scripts/**']
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path:
      include: ['terraform/**', 'terraform/components.json', '.crow/**', 'scripts/**']
  - event: manual
steps:
  - name: validate-components
    image: git.weinbender.io/labs/ci-base:main
    environment:
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache
    commands:
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - ruby scripts/validate-terraform-components.rb
      - for component in aws cloudflare gcp-remind-me gcp-weinbender-io mgmt; do terraform -chdir="terraform/$component" init -backend=false && terraform -chdir="terraform/$component" fmt -check && terraform -chdir="terraform/$component" validate; done

# Plan/apply for Crow lives in .crow/terraform-plan-apply.yaml (manual) and uses
# static service-account credentials from Crow secrets; see terraform/crow-sa.md.
