---
name: Ansible Playbook
when:
  - event: manual
  - event: cron
    cron: ansible
steps:
  - name: ansible
    image: git.weinbender.io/labs/ansible:main
    environment:
      OP_SERVICE_ACCOUNT_TOKEN:
        from_secret: ONE_PASSWORD_SA_TOKEN
      TS_OAUTH_CLIENT_SECRET:
        from_secret: TS_OAUTH_CLIENT_SECRET
    commands:
      - tailscaled --tun=userspace-networking --socks5-server=localhost:1055 --state=/tmp/tailscale.state >/tmp/tailscaled.log 2>&1 &
      - for i in $(seq 1 30); do [ -S /var/run/tailscale/tailscaled.sock ] && break; sleep 1; done; [ -S /var/run/tailscale/tailscaled.sock ] || { cat /tmp/tailscaled.log; exit 1; }
      - tailscale up --auth-key="$TS_OAUTH_CLIENT_SECRET?preauthorized=true&ephemeral=true" --advertise-tags=tag:ci --timeout=30s
      - tailscale status >/dev/null 2>&1 || { cat /tmp/tailscaled.log; exit 1; }
      - mkdir -p ~/.ssh
      - printf 'Host *\n  ProxyCommand tailscale nc %%h %%p\n' > ~/.ssh/config
      - chmod 600 ~/.ssh/config
      - (cd ansible && ANSIBLE_CONFIG="$PWD/ansible.cfg" ansible-lint --config-file .ansible-lint)
      - ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" ANSIBLE_ROLES_PATH="$PWD/ansible/roles" ansible-playbook -i ansible/inventory.yaml ansible/playbooks/workloads.yaml

# Configure the existing 04:00 UTC schedule as a Crow cron named `ansible`.
# This workflow intentionally has no automatic push trigger because it changes
# infrastructure hosts.
