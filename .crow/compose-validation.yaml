---
name: Compose validation
when:
  - event: pull_request
    path:
      include: ['compose-stacks/**', 'ansible/inventory.yaml', '.crow/**']
  - event: manual
steps:
  - name: preflight
    image: git.weinbender.io/labs/ci-base:main
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - ruby scripts/preflight.rb

# Runs the authoritative preflight without deployment credentials.
