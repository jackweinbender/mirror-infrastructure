# Maintains non-hypervisor Debian servers after bootstrap. These hosts may be
# LXC containers, VMs, or bare metal, and must already be reachable over Tailscale
# using the configured Ansible user. This playbook is intended for CI/CD.
#
# Every host gets the base + tailscale baseline. Anything beyond that is
# declared per-host in inventory.yaml via host_roles (e.g. host_roles:
# [deploy, docker] or [docker, c5e_reconciler]) - this playbook is generic and
# doesn't hardcode which host gets which specialized role; that decision lives
# in inventory, in one place.
---
- name: Configure workloads
  hosts: workloads
  gather_facts: true
  become: true
  vars:
    workload_roles: "{{ host_roles | default([], true) }}"
  pre_tasks:
    - name: Validate this host's optional roles
      ansible.builtin.assert:
        that:
          - workload_roles | type_debug == 'list'
          - workload_roles | difference(['deploy', 'docker', 'c5e_reconciler']) | length == 0
          - workload_roles | unique | length == workload_roles | length
        fail_msg: >-
          host_roles must be a duplicate-free list containing only deploy,
          docker, and c5e_reconciler; received {{ workload_roles | to_json }}.
  roles:
    - base
    - tailscale
    - role: deploy
      when: "'deploy' in workload_roles"
    - role: docker
      when: "'docker' in workload_roles"
    - role: c5e_reconciler
      when: "'c5e_reconciler' in workload_roles"
