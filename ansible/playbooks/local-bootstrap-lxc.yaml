# Bootstraps an existing LXC container. Run this from the ansible directory on
# the local network. The container must already exist, be running, and permit
# root SSH access using the key supplied when it was created. The first play
# prompts for any of lxc_pve_host / lxc_prepare_ctid / lxc_bootstrap_tailscale_authkey
# not already supplied via --extra-vars - lxc_pve_host is a numbered menu
# built from the `hypervisors` inventory group (retries on invalid input) so
# you pick a valid host instead of typing its name - then hands off to the
# PVE host to prepare the container; the last play discovers its LAN address
# and configures it directly. Leave the Tailscale auth key blank at the
# prompt (or omit lxc_bootstrap_tailscale_authkey) to join the tailnet later.
#
# Bootstrap interactively (prompts for anything not passed via -e):
#   ansible-playbook playbooks/local-bootstrap-lxc.yaml
#
# Bootstrap non-interactively (CI/CD, no prompts):
#   ansible-playbook playbooks/local-bootstrap-lxc.yaml \
#     -e lxc_pve_host=caba-host \
#     -e lxc_prepare_ctid=105 \
#     -e lxc_bootstrap_tailscale_authkey=tskey-...
---
- name: Collect bootstrap inputs not already supplied via --extra-vars
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build the numbered PVE host menu
      ansible.builtin.set_fact:
        lxc_pve_host_menu: "{{ groups['hypervisors'] }}"

    - name: Prompt for the PVE host by number if not supplied
      ansible.builtin.pause:
        prompt: |-
          Proxmox host managing the container:
          {% for host in lxc_pve_host_menu %}
          {{ loop.index }}) {{ host }}
          {% endfor %}
          Enter a number
      register: lxc_pve_host_prompt
      vars:
        selection: "{{ lxc_pve_host_prompt.user_input | default('') | trim }}"
      until: >-
        selection is regex('^[0-9]+$') and
        (selection | int) >= 1 and
        (selection | int) <= (lxc_pve_host_menu | length)
      retries: 5
      delay: 0
      when: lxc_pve_host is not defined

    - name: Record the selected PVE host
      ansible.builtin.set_fact:
        lxc_pve_host: "{{ lxc_pve_host_menu[(lxc_pve_host_prompt.user_input | int) - 1] }}"
      when: lxc_pve_host is not defined

    - name: Confirm the PVE host is a known hypervisor
      ansible.builtin.assert:
        that:
          - lxc_pve_host in groups['hypervisors']
        fail_msg: >-
          {{ lxc_pve_host }} is not in the hypervisors inventory group
          ({{ groups['hypervisors'] | join(', ') }}).

    - name: Prompt for the container ID if not supplied
      ansible.builtin.pause:
        prompt: LXC container ID (e.g. 105)
      register: lxc_prepare_ctid_prompt
      when: lxc_prepare_ctid is not defined

    - name: Record the prompted container ID
      ansible.builtin.set_fact:
        lxc_prepare_ctid: "{{ lxc_prepare_ctid_prompt.user_input }}"
      when: lxc_prepare_ctid is not defined

    - name: Prompt for the Tailscale auth key if not supplied
      ansible.builtin.pause:
        prompt: Tailscale auth key (leave blank to join the tailnet later)
        echo: false
      register: lxc_bootstrap_tailscale_authkey_prompt
      when: lxc_bootstrap_tailscale_authkey is not defined

    - name: Record the prompted Tailscale auth key
      ansible.builtin.set_fact:
        lxc_bootstrap_tailscale_authkey: "{{ lxc_bootstrap_tailscale_authkey_prompt.user_input }}"
      when: lxc_bootstrap_tailscale_authkey is not defined

- name: Prepare LXC container on the PVE host
  hosts: "{{ hostvars['localhost']['lxc_pve_host'] }}"
  gather_facts: false
  vars:
    lxc_prepare_ctid: "{{ hostvars['localhost']['lxc_prepare_ctid'] }}"
  tasks:
    - name: Include LXC prepare tasks
      ansible.builtin.import_tasks: ../tasks/lxc_prepare/main.yml

- name: Bootstrap the container over SSH
  hosts: lxc_new
  gather_facts: true
  vars:
    lxc_bootstrap_tailscale_authkey: "{{ hostvars['localhost']['lxc_bootstrap_tailscale_authkey'] }}"
  tasks:
    - name: Include LXC bootstrap tasks
      ansible.builtin.import_tasks: ../tasks/lxc_bootstrap/main.yml
