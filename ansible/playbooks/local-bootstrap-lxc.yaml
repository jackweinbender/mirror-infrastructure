# Bootstraps an existing LXC container: creates the management user, joins
# the tailnet, and registers the host in inventory so workloads.yaml can
# take over. Run from the ansible directory on the local network. The
# container must already exist, be running, and permit root SSH with the
# key supplied at creation.
#
# The first play prompts for any input not already supplied via -e:
#   ansible-playbook playbooks/local-bootstrap-lxc.yaml
#
# Non-interactive (CI/CD, no prompts):
#   ansible-playbook playbooks/local-bootstrap-lxc.yaml \
#     -e lxc_pve_host=caba-host \
#     -e lxc_prepare_ctid=105 \
#     -e lxc_bootstrap_tailscale_authkey=tskey-...
---
- name: Collect bootstrap inputs not already supplied via --extra-vars
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Prompt for the PVE host by number
      ansible.builtin.pause:
        prompt: |-
          Proxmox host managing the container:
          {% for host in groups['hypervisors'] %}
          {{ loop.index }}) {{ host }}
          {% endfor %}
          Enter a number
      register: lxc_pve_host_menu
      vars:
        selection: "{{ lxc_pve_host_menu.user_input | default('') | trim }}"
      until: selection is regex('^[0-9]+$') and 1 <= (selection | int) <= (groups['hypervisors'] | length)
      retries: 5
      delay: 0
      when: lxc_pve_host is not defined

    - name: Record the selected PVE host
      ansible.builtin.set_fact:
        lxc_pve_host: "{{ groups['hypervisors'][(lxc_pve_host_menu.user_input | int) - 1] }}"
      when: lxc_pve_host is not defined

    - name: Confirm the PVE host is a known hypervisor (guards -e input)
      ansible.builtin.assert:
        that:
          - lxc_pve_host in groups['hypervisors']
        fail_msg: >-
          {{ lxc_pve_host }} is not in the hypervisors inventory group
          ({{ groups['hypervisors'] | join(', ') }}).

    - name: Prompt for the container ID
      ansible.builtin.pause:
        prompt: LXC container ID (e.g. 105)
      register: lxc_prepare_ctid_prompt
      vars:
        ctid: "{{ lxc_prepare_ctid_prompt.user_input | default('') | trim }}"
      until: ctid is regex('^[0-9]+$')
      retries: 5
      delay: 0
      when: lxc_prepare_ctid is not defined

    - name: Record the container ID
      ansible.builtin.set_fact:
        lxc_prepare_ctid: "{{ lxc_prepare_ctid_prompt.user_input | trim }}"
      when: lxc_prepare_ctid is not defined

    - name: Prompt for the Tailscale auth key
      ansible.builtin.pause:
        prompt: Tailscale auth key (required - bootstrap puts the container on the tailnet)
        echo: false
      register: lxc_bootstrap_authkey_prompt
      vars:
        authkey: "{{ lxc_bootstrap_authkey_prompt.user_input | default('') | trim }}"
      until: authkey | length > 0
      retries: 5
      delay: 0
      when: lxc_bootstrap_tailscale_authkey is not defined

    - name: Record the Tailscale auth key
      ansible.builtin.set_fact:
        lxc_bootstrap_tailscale_authkey: "{{ lxc_bootstrap_authkey_prompt.user_input | trim }}"
      no_log: true
      when: lxc_bootstrap_tailscale_authkey is not defined

    - name: Prompt for whether this container will run Docker
      ansible.builtin.pause:
        prompt: Will this container run Docker? (y/N)
      register: lxc_prepare_enable_docker_prompt
      when: lxc_prepare_enable_docker is not defined

    - name: Record whether this container will run Docker
      ansible.builtin.set_fact:
        lxc_prepare_enable_docker: "{{ lxc_prepare_enable_docker_prompt.user_input | default('') | trim | lower in ['y', 'yes'] }}"
      when: lxc_prepare_enable_docker is not defined

- name: Prepare the LXC container on its PVE host
  hosts: "{{ hostvars['localhost']['lxc_pve_host'] }}"
  gather_facts: false
  vars:
    lxc_prepare_ctid: "{{ hostvars['localhost']['lxc_prepare_ctid'] }}"
    lxc_prepare_enable_docker: "{{ hostvars['localhost']['lxc_prepare_enable_docker'] }}"
  tasks:
    - name: Include LXC prepare tasks
      ansible.builtin.import_tasks: ../tasks/lxc_prepare/main.yml

- name: Bootstrap the container over SSH
  hosts: lxc_new
  gather_facts: true
  vars:
    lxc_bootstrap_tailscale_authkey: "{{ hostvars['localhost']['lxc_bootstrap_tailscale_authkey'] }}"
    lxc_bootstrap_enable_docker: "{{ hostvars['localhost']['lxc_prepare_enable_docker'] }}"
  tasks:
    - name: Include LXC bootstrap tasks
      ansible.builtin.import_tasks: ../tasks/lxc_bootstrap/main.yml
