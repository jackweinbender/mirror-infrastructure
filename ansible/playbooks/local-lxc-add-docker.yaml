# Adds Docker-required LXC features (nesting, keyctl) to an existing container.
# Run: ansible-playbook playbooks/local-lxc-add-docker.yaml -e lxc_ctid=105
---
- name: Collect inputs not already supplied via --extra-vars
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Collect PVE host input
      ansible.builtin.import_tasks: ../tasks/lxc_inputs/pve_host.yml
    - name: Collect container ID input
      ansible.builtin.import_tasks: ../tasks/lxc_inputs/ctid.yml

- name: Add Docker features to the LXC container
  hosts: "{{ hostvars.localhost.lxc_pve_host | default('localhost') }}"
  gather_facts: false
  vars:
    lxc_features_ctid: "{{ hostvars.localhost.lxc_ctid }}"
    lxc_features_enable_docker: true
  tasks:
    - name: Include Docker feature task
      ansible.builtin.import_tasks: ../tasks/lxc_features/add_docker.yml

    - name: Include reboot task
      ansible.builtin.import_tasks: ../tasks/lxc_features/reboot.yml

    - name: Print summary
      ansible.builtin.debug:
        msg: >-
          Docker features (nesting, keyctl) have been added to container
          {{ lxc_features_ctid }}. The container has been rebooted for the
          changes to take effect.
      when: lxc_features_reboot_required | default(false)

    - name: Print summary (no action taken)
      ansible.builtin.debug:
        msg: >-
          Docker features (nesting, keyctl) were already present on container
          {{ lxc_features_ctid }}. No action taken.
      when: not (lxc_features_reboot_required | default(false))
