# This role installs and configures Tailscale.

- name: Check whether Tailscale is already installed
  ansible.builtin.command:
    argv:
      - which
      - tailscale
  register: tailscale_check
  failed_when: false
  changed_when: false
  when: base_install_tailscale | default(true)

- name: Download the Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
  when:
    - base_install_tailscale | default(true)
    - tailscale_check.rc != 0

- name: Run the Tailscale install script
  ansible.builtin.command:
    argv:
      - sh
      - /tmp/tailscale-install.sh
  when:
    - base_install_tailscale | default(true)
    - tailscale_check.rc != 0
  changed_when: true

- name: Remove the Tailscale install script
  ansible.builtin.file:
    path: /tmp/tailscale-install.sh
    state: absent
  when: base_install_tailscale | default(true)

- name: Check whether Tailscale already has an IP (already joined)
  ansible.builtin.command:
    argv:
      - tailscale
      - ip
      - -4
  register: tailscale_ip
  changed_when: false
  failed_when: false
  when:
    - base_install_tailscale | default(true)
    - base_tailscale_authkey | default('') | length > 0

- name: Print Tailscale approval instructions
  ansible.builtin.debug:
    msg: >-
      The container is joining the tailnet. If device approval is enabled,
      approve the new device in the Tailscale admin UI while the next task waits.
      Ensure the machine has the tag:ansible tag before continuing.
  when:
    - base_install_tailscale | default(true)
    - base_tailscale_authkey | default('') | length > 0
    - tailscale_ip.rc != 0

- name: Join the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--authkey={{ base_tailscale_authkey }}"
      - --ssh
  when:
    - base_install_tailscale | default(true)
    - base_tailscale_authkey | default('') | length > 0
    - tailscale_ip.rc != 0
  no_log: true
  changed_when: true

- name: Get Tailscale status
  ansible.builtin.command:
    argv:
      - tailscale
      - status
      - --self
      - --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when:
    - base_install_tailscale | default(true)
    - base_tailscale_authkey | default('') | length > 0

- name: Source the Tailscale hostname
  ansible.builtin.set_fact:
    tailscale_hostname: >-
      {{ (tailscale_status.stdout | from_json).Self.DNSName | default('') | trim | trim('.') }}
  when:
    - base_install_tailscale | default(true)
    - base_tailscale_authkey | default('') | length > 0
    - tailscale_status.rc == 0
    - tailscale_status.stdout | trim | length > 0
