---
# Installs Tailscale and, when tailscale_authkey is set and the host has not
# already joined, brings it onto the tailnet with Tailscale SSH enabled.
# Sets tailscale_hostname (the host's tailnet FQDN) whenever the host is
# joined, for callers that need it (bootstrap's inventory registration).
#
# Installed from Tailscale's own apt repo (pinned key + repo file, same
# pattern as roles/docker), not the curl|sh install.sh convenience script -
# auditable and reproducible rather than whatever the vendor ships that day.

- name: Check whether Tailscale is already installed
  ansible.builtin.command:
    argv:
      - which
      - tailscale
  register: tailscale_check
  failed_when: false
  changed_when: false

- name: Install Tailscale
  when: tailscale_check.rc != 0
  block:
    - name: Ensure prerequisite packages are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gpg
        state: present

    - name: Ensure the apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Tailscale's GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /etc/apt/keyrings/tailscale.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add Tailscale's apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/tailscale.asc]
          https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
        filename: tailscale
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Check whether the host has already joined the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - ip
      - -4
  register: tailscale_ip
  failed_when: false
  changed_when: false

- name: Join the tailnet
  when:
    - tailscale_authkey | length > 0
    - tailscale_ip.rc != 0
  block:
    - name: Print device approval instructions
      ansible.builtin.debug:
        msg: >-
          The host is joining the tailnet. If device approval is enabled,
          approve it in the Tailscale admin UI while the next task waits,
          and give it the tag:ansible tag so the tailnet ACL permits
          management traffic.

    - name: Run tailscale up
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--authkey={{ tailscale_authkey }}"
          - --ssh
      no_log: true
      changed_when: true

- name: Read Tailscale status
  ansible.builtin.command:
    argv:
      - tailscale
      - status
      - --self
      - --json
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Record the tailnet hostname
  ansible.builtin.set_fact:
    tailscale_hostname: >-
      {{ (tailscale_status.stdout | from_json).Self.DNSName | default('') | trim | trim('.') }}
  when:
    - tailscale_status.rc == 0
    - tailscale_status.stdout | trim | length > 0
