---
- name: Verify Tailscale role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check Tailscale is installed
      ansible.builtin.command:
        argv:
          - tailscale
          - version
      register: tailscale_version
      changed_when: false
      failed_when: tailscale_version.rc != 0

    - name: Assert Tailscale version output
      ansible.builtin.assert:
        that:
          - "'tailscale' in tailscale_version.stdout.lower()"
        fail_msg: Tailscale not properly installed

    - name: Check tailscale binary exists
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary
      failed_when: not tailscale_binary.stat.exists

    - name: Assert tailscale binary executable
      ansible.builtin.assert:
        that:
          - tailscale_binary.stat.executable
        fail_msg: tailscale binary not executable

    - name: Check tailscaled daemon binary exists
      ansible.builtin.stat:
        path: /usr/sbin/tailscaled
      register: tailscale_tailscaled_binary
      failed_when: not tailscale_tailscaled_binary.stat.exists

    - name: Check tailscaled systemd service exists
      ansible.builtin.stat:
        path: /lib/systemd/system/tailscaled.service
      register: tailscale_tailscaled_service
      failed_when: not tailscale_tailscaled_service.stat.exists

    - name: Check tailscaled is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - tailscaled
      register: tailscale_tailscaled_enabled
      changed_when: false
      failed_when: tailscale_tailscaled_enabled.rc != 0

    - name: Assert tailscaled daemon enabled
      ansible.builtin.assert:
        that:
          - tailscale_tailscaled_enabled.stdout.strip() == "enabled"
        fail_msg: tailscaled daemon not enabled

    - name: Check the Tailscale apt source is configured
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/tailscale.sources
      register: tailscale_repo
      failed_when: not tailscale_repo.stat.isreg

    - name: Check the Tailscale repository key exists
      ansible.builtin.stat:
        path: /etc/apt/keyrings/tailscale.asc
      register: tailscale_gpg_key
      failed_when: not tailscale_gpg_key.stat.isreg

    - name: Check the Tailscale package is installed
      ansible.builtin.package_facts:
        manager: apt
      register: tailscale_package_facts

    - name: Assert the Tailscale package is installed
      ansible.builtin.assert:
        that:
          - "'tailscale' in tailscale_package_facts.ansible_facts.packages"
