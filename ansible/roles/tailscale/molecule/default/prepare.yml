---
- name: Prepare test container
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install openssh-server and logrotate
      ansible.builtin.apt:
        name:
          - openssh-server
          - logrotate
        state: present
        update_cache: true

    - name: Remove any Tailscale package inherited by the test image
      ansible.builtin.apt:
        name: tailscale
        state: absent

    - name: Remove Tailscale CLI and daemon binaries inherited by the test image
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/bin/tailscale
        - /usr/sbin/tailscaled
