---
- name: Verify Vector role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check the vector binary is installed
      ansible.builtin.command:
        argv:
          - vector
          - --version
      register: vector_version
      changed_when: false
      failed_when: vector_version.rc != 0

    - name: Assert vector is installed
      ansible.builtin.assert:
        that:
          - "'vector' in vector_version.stdout"
        fail_msg: Vector binary not installed

    - name: Check the Vector config exists
      ansible.builtin.stat:
        path: /etc/vector/vector.toml
      register: vector_config_stat

    - name: Assert the Vector config exists
      ansible.builtin.assert:
        that:
          - vector_config_stat.stat.exists
        fail_msg: Vector config was not rendered to /etc/vector/vector.toml

    - name: Check the Vector systemd override exists
      ansible.builtin.stat:
        path: /etc/systemd/system/vector.service.d/override.conf
      register: vector_override_stat

    - name: Assert the Vector systemd override exists
      ansible.builtin.assert:
        that:
          - vector_override_stat.stat.exists
        fail_msg: Vector systemd override was not rendered

    - name: Check the Vector service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - vector
      register: vector_enabled
      changed_when: false
      failed_when: vector_enabled.rc != 0

    - name: Assert the Vector service is enabled
      ansible.builtin.assert:
        that:
          - vector_enabled.stdout.strip() == "enabled"
        fail_msg: Vector service not enabled

    - name: Check the Vector service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - vector
      register: vector_status
      changed_when: false
      failed_when: vector_status.rc != 0

    - name: Assert the Vector service is active
      ansible.builtin.assert:
        that:
          - vector_status.stdout.strip() == "active"
        fail_msg: Vector service not active