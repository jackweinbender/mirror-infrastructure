---
# vector role: installs the Vector data-pipeline agent (apt package, systemd
# service) on an LXC and ships this host's Docker container + systemd journald
# logs to the central VictoriaLogs collector (compose-stacks/victorialogs) over
# HTTPS. Applied to workload hosts via the `vector` host_role in inventory.yaml.
#
# Docker log collection is enabled automatically when /var/run/docker.sock is
# present (docker-enabled LXC/VMs); journald is always collected. The role never
# installs Docker itself - it only collects where the socket already exists.

# Ingest endpoint on the central VictoriaLogs collector (lxc-docker-core0),
# reached through the host Traefik gateway. Query args tell VictoriaLogs which
# event fields hold the timestamp, the message, and the stream-labelling fields
# (host + source_type are stamped by the remap transforms in vector.toml.j2).
vector_sink_uri: "https://victorialogs.weinbender.io/insert/jsonline?_stream_fields=host,source_type&_msg_field=message&_time_field=timestamp"

# Host identity stamped onto every event. Defaults to the short inventory host
# id (e.g. "docker0-lxc") so searches can distinguish sources.
vector_host_id: "{{ inventory_hostname_short }}"

# Docker socket path used by the docker_logs source.
vector_docker_socket: /var/run/docker.sock

# Disk buffer capacity for the sink so a brief VictoriaLogs/Traefik outage does
# not drop queued events. Must be an integer byte count >= 268435488 bytes.
vector_buffer_max_size: 536870912

# Vector package distribution tag as published by apt.vector.dev (the -1 suffix
# should not be included here; the apt module resolves the distro build).
vector_apt_suite: stable
vector_apt_component: vector-0