---
- name: Inspect whether c5e credentials are initialized
  ansible.builtin.stat:
    path: /etc/c5e-reconciler/c5e.env
    follow: false
  register: c5e_reconciler_bootstrap_environment
  no_log: true

- name: Skip c5e setup until targeted credential bootstrap
  ansible.builtin.debug:
    msg: Run playbooks/c5e-reconciler.yaml once to initialize c5e credentials.
  when:
    - c5e_reconciler_op_credentials is not defined or (c5e_reconciler_op_credentials | length == 0)
    - not (c5e_reconciler_bootstrap_environment.stat.isreg | default(false))

- name: Configure c5e when credentials are available
  when:
    - >-
      (c5e_reconciler_op_credentials is defined and
       (c5e_reconciler_op_credentials | length > 0))
      or (c5e_reconciler_bootstrap_environment.stat.isreg | default(false))
  block:
    - name: Validate optional proxy-network migration identifiers
      ansible.builtin.assert:
        that:
          - >-
            (c5e_reconciler_proxy_network_migration_id | default('') | length == 0)
            ==
            (c5e_reconciler_proxy_network_migration_daemon_id | default('') | length == 0)
          - >-
            (c5e_reconciler_proxy_network_migration_id | default('') | length == 0)
            or c5e_reconciler_proxy_network_migration_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
          - >-
            (c5e_reconciler_proxy_network_migration_daemon_id | default('') | length == 0)
            or c5e_reconciler_proxy_network_migration_daemon_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
        fail_msg: >-
          Supply both exact proxy-network migration identifiers or leave both
          unset; each supplied identifier must match the c5e safe-ID format.

    - name: Prepare protected controller configuration
      ansible.builtin.import_tasks: prepare.yml

    - name: Stop any existing c5e Compose controller
      ansible.builtin.import_tasks: retire_compose.yml

    - name: Install and start the c5e systemd controller
      ansible.builtin.import_tasks: install.yml
