---
- name: Inspect the existing c5e state volume without changing it
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - volume
      - inspect
      - --format
      - "{{ '{{json .}}' }}"
      - c5e_reconciler_state
  register: c5e_state_volume_inspect
  changed_when: false
  no_log: true

- name: Decode the existing c5e state volume metadata
  ansible.builtin.set_fact:
    c5e_state_volume_info: "{{ c5e_state_volume_inspect.stdout | from_json }}"
  no_log: true


- name: Require the exact state volume and reject conflicting owner labels
  ansible.builtin.assert:
    that:
      - c5e_state_volume_info.Name == 'c5e_reconciler_state'
      - >-
        (c5e_state_volume_info.Labels | default({}, true)).get('com.docker.compose.project', 'c5e-reconciler')
        == 'c5e-reconciler'
      - >-
        (c5e_state_volume_info.Labels | default({}, true)).get('com.docker.compose.volume', 'c5e_reconciler_state')
        == 'c5e_reconciler_state'
    fail_msg: >-
      Refusing to reuse a same-name volume with conflicting Compose ownership
      labels.
  no_log: true

- name: Capture a stable identity for the existing c5e volume
  ansible.builtin.set_fact:
    c5e_state_volume_identity: >-
      {{ [c5e_state_volume_info.Name,
          c5e_state_volume_info.Driver,
          c5e_state_volume_info.Mountpoint,
          c5e_state_volume_info.CreatedAt | default(''),
          c5e_state_volume_info.Scope,
          c5e_state_volume_info.Options | default({}, true) | dictsort,
          c5e_state_volume_info.Labels | default({}, true) | dictsort] | to_json }}
  no_log: true

- name: Protect the c5e state volume identity record directory
  ansible.builtin.file:
    path: /var/lib/c5e-reconciler
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect the recorded c5e state volume identity
  ansible.builtin.stat:
    path: /var/lib/c5e-reconciler/state-volume-identity.json
    follow: false
  register: c5e_state_volume_identity_file

- name: Read the recorded c5e state volume identity
  ansible.builtin.slurp:
    src: /var/lib/c5e-reconciler/state-volume-identity.json
  register: c5e_state_volume_identity_content
  when: c5e_state_volume_identity_file.stat.isreg | default(false)
  no_log: true

- name: Require matching labels or a confirmed unchanged volume identity
  ansible.builtin.assert:
    that:
      - >-
        not c5e_state_volume_identity_file.stat.exists
        or (
          (c5e_state_volume_identity_file.stat.isreg | default(false))
          and (
            c5e_state_volume_identity_content.content | default('') | b64decode | trim
            == c5e_state_volume_identity
          )
        )
      - >-
        (c5e_state_volume_identity_file.stat.isreg | default(false))
        or (
          (c5e_state_volume_info.Labels | default({}, true)).get('com.docker.compose.project', '') == 'c5e-reconciler'
          and (c5e_state_volume_info.Labels | default({}, true)).get('com.docker.compose.volume', '') == 'c5e_reconciler_state'
        )
        or c5e_state_volume_identity_confirmation == 'CONFIRM_C5E_STATE_VOLUME'
    fail_msg: >-
      Refusing to reuse this state volume without matching Compose labels or an
      explicit operator confirmation of its identity.
  no_log: true

- name: Record the confirmed c5e state volume identity
  ansible.builtin.copy:
    dest: /var/lib/c5e-reconciler/state-volume-identity.json
    content: "{{ c5e_state_volume_identity }}\n"
    owner: root
    group: root
    mode: "0600"
    diff: false
  when: not c5e_state_volume_identity_file.stat.exists
  no_log: true

- name: Inspect the legacy c5e Compose project directory
  ansible.builtin.stat:
    path: /etc/compose-stacks/c5e-reconciler
    follow: false
  register: c5e_legacy_project_dir

- name: Inspect the legacy c5e Compose ownership marker
  ansible.builtin.stat:
    path: /etc/compose-stacks/c5e-reconciler/.managed-by-github-actions
    follow: false
  register: c5e_legacy_marker

- name: Read the legacy c5e Compose ownership marker
  ansible.builtin.slurp:
    src: /etc/compose-stacks/c5e-reconciler/.managed-by-github-actions
  register: c5e_legacy_marker_content
  when: c5e_legacy_marker.stat.isreg | default(false)

- name: Find containers owned by the legacy c5e Compose project
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - ls
      - --all
      - --quiet
      - --filter
      - label=com.docker.compose.project=c5e-reconciler
  register: c5e_legacy_project_container_ids
  changed_when: false

- name: Find the legacy Compose service by its generated container name
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - ls
      - --all
      - --quiet
      - --filter
      - name=c5e-reconciler-c5e-reconciler-1
  register: c5e_legacy_named_container_ids
  changed_when: false

- name: Combine exact legacy project and service candidates
  ansible.builtin.set_fact:
    c5e_legacy_container_ids: >-
      {{ (c5e_legacy_project_container_ids.stdout_lines
          + c5e_legacy_named_container_ids.stdout_lines) | unique | list }}

- name: Require the matching marker and labelled legacy service before touching legacy state
  ansible.builtin.assert:
    that:
      - >-
        not (
          c5e_legacy_project_dir.stat.exists
          or c5e_legacy_marker.stat.exists
          or (c5e_legacy_container_ids | length > 0)
        )
        or (
          (c5e_legacy_container_ids | length > 0)
          and (c5e_legacy_project_dir.stat.isdir | default(false))
          and (c5e_legacy_marker.stat.isreg | default(false))
          and (
            c5e_legacy_marker_content.content | default('') | b64decode
            | regex_findall('(?m)^STACK_NAME=.*$') == ['STACK_NAME=c5e-reconciler']
          )
        )
    fail_msg: >-
      Refusing to retire c5e Compose state without a matching marker and at least
      one candidate service container to verify.

- name: Inspect legacy c5e Compose labels
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - inspect
      - --format
      - "{{ '{{json .Config.Labels}}' }}"
      - "{{ item }}"
  loop: "{{ c5e_legacy_container_ids }}"
  loop_control:
    label: "{{ item }}"
  register: c5e_legacy_container_labels
  changed_when: false

- name: Require exact legacy Compose project and service labels
  ansible.builtin.assert:
    that:
      - >-
        (item.stdout | from_json | default({}, true)).get('com.docker.compose.project', '')
        == 'c5e-reconciler'
      - >-
        (item.stdout | from_json | default({}, true)).get('com.docker.compose.service', '')
        == 'c5e-reconciler'
    fail_msg: >-
      Refusing to stop a container whose Compose project/service labels do not
      identify the legacy c5e reconciler service.
  loop: "{{ c5e_legacy_container_labels.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect whether legacy c5e containers are running
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - inspect
      - --format
      - "{{ '{{.State.Running}}' }}"
      - "{{ item }}"
  loop: "{{ c5e_legacy_container_ids }}"
  loop_control:
    label: "{{ item }}"
  register: c5e_legacy_container_states
  changed_when: false

- name: Stop verified legacy c5e service containers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - stop
      - --time
      - "30"
      - "{{ item.item }}"
  loop: "{{ c5e_legacy_container_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout == 'true'
  changed_when: true

- name: Remove verified legacy c5e service containers without deleting volumes
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - rm
      - "{{ item.item }}"
  loop: "{{ c5e_legacy_container_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Remove the verified legacy c5e Compose project directory
  ansible.builtin.file:
    path: /etc/compose-stacks/c5e-reconciler
    state: absent
  when: c5e_legacy_project_dir.stat.isdir | default(false)
