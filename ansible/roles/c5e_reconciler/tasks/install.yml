---
- name: Install the c5e systemd container unit
  ansible.builtin.template:
    src: c5e-reconciler.service.j2
    dest: /etc/systemd/system/c5e-reconciler.service
    owner: root
    group: root
    mode: "0644"
  register: c5e_reconciler_systemd_unit

- name: Ensure the c5e systemd controller is enabled and running
  ansible.builtin.systemd:
    name: c5e-reconciler.service
    daemon_reload: true
    enabled: true
    state: >-
      {{ 'restarted' if
         c5e_reconciler_systemd_unit.changed
         or (c5e_reconciler_environment_file_install.changed | default(false))
         or (c5e_reconciler_environment_file_protection.changed | default(false))
         or (c5e_reconciler_image_pull.changed | default(false))
         else 'started' }}
