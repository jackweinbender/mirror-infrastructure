---
- name: Verify host operations capability
  hosts: all
  gather_facts: true
  tasks:
    - name: Check ansible user exists
      ansible.builtin.user:
        name: ansible
        state: present
      check_mode: true
      register: host_ops_ansible_user_check
      failed_when: host_ops_ansible_user_check.changed

    - name: Check jlw user exists
      ansible.builtin.user:
        name: jlw
        state: present
      check_mode: true
      register: host_ops_jlw_user_check
      failed_when: host_ops_jlw_user_check.changed

    - name: Check ansible user shell is /bin/bash
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - ansible
      register: host_ops_ansible_shell
      changed_when: false
      failed_when: host_ops_ansible_shell.stdout.split(':')[6] != "/bin/bash"

    - name: Check jlw user shell is /usr/bin/zsh
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - jlw
      register: host_ops_jlw_shell
      changed_when: false
      failed_when: host_ops_jlw_shell.stdout.split(':')[6] != "/usr/bin/zsh"

    - name: Check root user shell is /usr/bin/zsh
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - root
      register: host_ops_root_shell
      changed_when: false
      failed_when: host_ops_root_shell.stdout.split(':')[6] != "/usr/bin/zsh"

    - name: Collect sudoers file metadata
      ansible.builtin.stat:
        path: /etc/sudoers.d/{{ item }}
      register: host_ops_sudoers_stat
      loop:
        - ansible
        - jlw

    - name: Check sudoers files exist with correct mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0440"
      loop: "{{ host_ops_sudoers_stat.results }}"

    - name: Check required packages are installed
      ansible.builtin.package_facts:
        manager: apt
      register: host_ops_package_facts

    - name: Ensure critical packages installed
      ansible.builtin.assert:
        that:
          - "'sudo' in host_ops_package_facts.ansible_facts.packages"
          - "'curl' in host_ops_package_facts.ansible_facts.packages"
          - "'git' in host_ops_package_facts.ansible_facts.packages"
          - "'zsh' in host_ops_package_facts.ansible_facts.packages"
          - "'unattended-upgrades' in host_ops_package_facts.ansible_facts.packages"
          - "'needrestart' in host_ops_package_facts.ansible_facts.packages"
          - "'vector' in host_ops_package_facts.ansible_facts.packages"
        fail_msg: Critical packages missing from host operations profile

    - name: Check Vector journald config exists
      ansible.builtin.stat:
        path: /etc/vector/conf.d/00-journald.toml
      register: host_ops_vector_config
      failed_when: not host_ops_vector_config.stat.exists

    - name: Read Vector journald config
      ansible.builtin.slurp:
        src: /etc/vector/conf.d/00-journald.toml
      register: host_ops_vector_config_content

    - name: Assert Vector normalizes journald fields
      ansible.builtin.assert:
        that:
          - >-
            '.app = .SYSLOG_IDENTIFIER' in
            (host_ops_vector_config_content.content | b64decode)
          - >-
            '.level = to_syslog_level(to_int(.PRIORITY) ?? 6) ?? "info"' in
            (host_ops_vector_config_content.content | b64decode)
          - >-
            'if is_null(.app)' in
            (host_ops_vector_config_content.content | b64decode)
          - >-
            '_stream_fields=host,app' in
            (host_ops_vector_config_content.content | b64decode)

    - name: Check Vector service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - vector
      register: host_ops_vector_service
      changed_when: false
      failed_when: host_ops_vector_service.stdout.strip() != "active"

    - name: Collect unattended-upgrades config metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      register: host_ops_unattended_stat
      loop:
        - /etc/apt/apt.conf.d/20auto-upgrades
        - /etc/apt/apt.conf.d/50unattended-upgrades

    - name: Check unattended-upgrades config files exist
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ host_ops_unattended_stat.results }}"

    - name: Check sshd hardening config exists and has PasswordAuthentication no
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - PasswordAuthentication no
          - /etc/ssh/sshd_config.d/99-hardening.conf
      register: host_ops_sshd_hardening
      changed_when: false
      failed_when: host_ops_sshd_hardening.rc != 0

    - name: Check host keys regenerated marker exists
      ansible.builtin.stat:
        path: /etc/ssh/.base-host-keys-regenerated
      register: host_ops_host_keys_marker
      failed_when: not host_ops_host_keys_marker.stat.exists

    - name: Check journald drop-in exists
      ansible.builtin.stat:
        path: /etc/systemd/journald.conf.d/99-base-retention.conf
      register: host_ops_journald_dropin
      failed_when: not host_ops_journald_dropin.stat.exists

    - name: Check update-motd.d banner exists and is executable
      ansible.builtin.stat:
        path: /etc/update-motd.d/10-banner
      register: host_ops_motd_banner
      failed_when: not host_ops_motd_banner.stat.exists or not host_ops_motd_banner.stat.executable

    - name: Collect autologin override metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      register: host_ops_autologin_stat
      loop:
        - /etc/systemd/system/container-getty@.service.d/override.conf
        - /etc/systemd/system/console-getty.service.d/override.conf

    - name: Check autologin overrides exist
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ host_ops_autologin_stat.results }}"

    - name: Check logrotate.conf has rotate 4
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - ^rotate 4
          - /etc/logrotate.conf
      register: host_ops_logrotate_check
      changed_when: false
      failed_when: host_ops_logrotate_check.rc != 0
