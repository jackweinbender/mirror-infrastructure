---
- name: Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present

- name: Generate the configured locale
  community.general.locale_gen:
    name: "{{ host_ops_locale }}"
    state: present

- name: Set the default system locale
  ansible.builtin.copy:
    content: |
      LANG={{ host_ops_locale }}
      LANGUAGE={{ host_ops_locale }}
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"

- name: Read the current timezone, NTP sync status, and CanNTP capability
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - -p
      - Timezone
      - -p
      - NTP
      - -p
      - CanNTP
      - --value
  register: host_ops_time_status
  changed_when: false

- name: Set the timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ host_ops_timezone }}"
  when: host_ops_time_status.stdout_lines[0] != host_ops_timezone
  changed_when: host_ops_time_status.stdout_lines[0] != host_ops_timezone

- name: Enable NTP time synchronization
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-ntp
      - "true"
  when:
    - host_ops_time_status.stdout_lines[1] != 'yes'
    - host_ops_time_status.stdout_lines[2] == 'yes'
  changed_when: host_ops_time_status.stdout_lines[1] != 'yes'
