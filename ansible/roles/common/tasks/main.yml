# This role provides common configuration for servers.

# The 'common' role now handles its own defaults via roles/common/defaults/main.yml
# and can load role-specific vars via roles/common/vars/main.yml if needed.
# The direct 'include_vars: vars.yml' is removed as it's redundant and caused errors.

- name: Upgrade installed packages (Debian/Ubuntu)
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600
  when: common_upgrade_packages | default(true)

- name: Ensure sudo is installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: Create the ansible user
  ansible.builtin.user:
    name: "{{ common_ansible_user | default('ansible') }}"
    shell: /bin/bash
    create_home: true

# --- Root SSH Key Management ---
- name: Ensure root's .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Fetch GitHub public keys for root
  ansible.builtin.uri:
    url: "https://github.com/{{ common_github_user | default('jackweinbender') }}.keys"
    return_content: true
  register: common_github_keys

- name: Install GitHub SSH keys for root
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ common_github_keys.content.splitlines() }}"
  when: item | trim | length > 0
# --- End Root SSH Key Management ---

- name: Configure passwordless sudo for the ansible user
  ansible.builtin.copy:
    content: "{{ common_ansible_user | default('ansible') }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ common_ansible_user | default('ansible') }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
