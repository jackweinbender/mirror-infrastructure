---
# Installing this role grants the host Docker and Compose capability.
- name: Verify the LXC has the feature flags Docker requires
  ansible.builtin.import_tasks: preflight.yml

- name: Install Docker Engine from the official apt repository
  ansible.builtin.import_tasks: install.yml

- name: Configure Docker data root when requested
  ansible.builtin.import_tasks: data_root.yml

- name: Grant docker-group membership
  ansible.builtin.import_tasks: group.yml
