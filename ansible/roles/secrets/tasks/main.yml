---
- name: Ensure c5e credential directory is root-only
  ansible.builtin.file:
    path: "{{ secrets_c5e_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect the existing c5e credential file
  ansible.builtin.stat:
    path: "{{ secrets_c5e_environment_file }}"
    follow: false
  register: secrets_c5e_environment

- name: Install the supplied c5e credential
  ansible.builtin.copy:
    dest: "{{ secrets_c5e_environment_file }}"
    content: "C5E_OP_CREDENTIALS={{ secrets_c5e_op_credentials | to_json }}\n"
    owner: root
    group: root
    mode: "0600"
  diff: false
  when: secrets_c5e_op_credentials is defined and (secrets_c5e_op_credentials | length > 0)
  register: secrets_c5e_install
  no_log: true

- name: Enforce root-only protection on an existing c5e credential
  ansible.builtin.file:
    path: "{{ secrets_c5e_environment_file }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  when:
    - secrets_c5e_op_credentials is not defined or (secrets_c5e_op_credentials | length == 0)
    - secrets_c5e_environment.stat.isreg | default(false)
  register: secrets_c5e_protection
