---
logging_vector_sink_host: "https://victorialogs.weinbender.io"
logging_vector_sink_url: "{{ logging_vector_sink_host }}/insert/jsonline"
logging_vector_sink_elasticsearch_url: "{{ logging_vector_sink_host }}/insert/elasticsearch/"
logging_vector_sink_common_query: "_msg_field=message&_time_field=timestamp"
logging_vector_host_id: "{{ inventory_hostname_short }}"
logging_vector_buffer_max_size: 536870912
logging_vector_apt_suite: stable
logging_vector_apt_component: vector-0
logging_vector_start_with_host_logs: "{{ inventory_hostname not in groups.get('stack_hosts', []) }}"
