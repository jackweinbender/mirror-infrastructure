---
# docker role: Docker Engine (official apt repo) + compose plugin, for any
# compose-stack workload host. Grants docker-group membership (passwordless
# docker access, no sudo) to docker_group_users. This role is the missing
# prerequisite compose-stacks/.github/workflows/deploy.yaml assumes already
# exists on the target host - it never provisions Docker itself.

# Accounts that get passwordless Docker access through the docker group.
# base and deploy always run before docker in workloads.yaml.
docker_group_users: "{{ [base_ansible_user] + base_extra_sudo_users + [deploy_user] }}"
