- name: Verify Docker role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check Docker version
      ansible.builtin.command:
        argv:
          - docker
          - --version
      register: docker_version
      changed_when: false
      failed_when: docker_version.rc != 0

    - name: Assert Docker version output
      ansible.builtin.assert:
        that:
          - "'Docker version' in docker_version.stdout"
        fail_msg: "Docker not properly installed"

    - name: Check Docker Compose plugin
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
      register: docker_compose_version
      changed_when: false
      failed_when: docker_compose_version.rc != 0

    - name: Assert Docker Compose version output
      ansible.builtin.assert:
        that:
          - "'Docker Compose version' in docker_compose_version.stdout or 'version' in docker_compose_version.stdout"
        fail_msg: "Docker Compose plugin not installed"

    - name: Check docker group exists
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Check ansible and jlw users are in docker group
      ansible.builtin.command:
        argv:
          - id
          - -Gn
          - "{{ item }}"
      register: docker_user_groups
      changed_when: false
      failed_when: docker_user_groups.rc != 0
      loop:
        - ansible
        - jlw

    - name: Assert users in docker group
      ansible.builtin.assert:
        that:
          - "'docker' in item.stdout"
        fail_msg: "{{ item.item }} user not in docker group"
      loop: "{{ docker_user_groups.results }}"

    - name: Check Docker daemon is running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - docker
      register: docker_status
      changed_when: false
      failed_when: docker_status.rc != 0

    - name: Assert Docker daemon running
      ansible.builtin.assert:
        that:
          - docker_status.stdout.strip() == "active"
        fail_msg: "Docker daemon not running"

    - name: Check Docker daemon is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - docker
      register: docker_enabled
      changed_when: false
      failed_when: docker_enabled.rc != 0

    - name: Assert Docker daemon enabled
      ansible.builtin.assert:
        that:
          - docker_enabled.stdout.strip() == "enabled"
        fail_msg: "Docker daemon not enabled"

    - name: Test ansible user can run docker without sudo
      ansible.builtin.command:
        argv:
          - docker
          - ps
      become: true
      become_user: ansible
      register: docker_test
      changed_when: false
      failed_when: docker_test.rc != 0

    - name: Assert docker ps works
      ansible.builtin.assert:
        that:
          - docker_test.rc == 0
        fail_msg: "ansible user cannot run docker"

    - name: Check Docker official repo is configured
      ansible.builtin.command:
        argv:
          - grep
          - -r
          - "docker.com"
          - /etc/apt/sources.list.d/
      register: docker_repo
      changed_when: false
      failed_when: docker_repo.rc != 0
