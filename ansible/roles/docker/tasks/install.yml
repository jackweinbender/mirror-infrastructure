---
# Docker's official install instructions for Debian
# (https://docs.docker.com/engine/install/debian/), translated to Ansible:
# add their GPG key + apt repo, then install the CE + compose/buildx
# plugins from it - not Debian's own docker.io package.
#
# Debian-only, deliberately: Docker's linux/debian and linux/ubuntu repo
# trees are separate and not interchangeable (an Ubuntu codename against
# the debian path 404s with a confusing "does not have a Release file"
# apt error). Fail fast with a clear message instead of that.

- name: Require a Debian host
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
    fail_msg: >-
      This role only supports Debian ({{ ansible_distribution }}
      {{ ansible_distribution_release }} detected on {{ inventory_hostname }}).
      Docker's linux/debian and linux/ubuntu apt repos are not interchangeable.

- name: Ensure prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

