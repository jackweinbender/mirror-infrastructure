---
# Molecule configuration for Debian base role testing.
# This spins up a fresh Debian container, applies the base role,
# and validates the configuration.

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: debian-bookworm
    image: debian:bookworm
    pre_build_image: true
    # Allow container to run systemd (important for some base role tasks)
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd-cgroups-agent

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  # Use the ansible directory's ansible.cfg (parent of role)
  config_options:
    defaults:
      roles_path: ../../..

verifier:
  name: ansible
