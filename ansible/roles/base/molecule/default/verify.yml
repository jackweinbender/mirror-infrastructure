---
- name: Verify base role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check ansible user exists
      ansible.builtin.user:
        name: ansible
        state: present
      check_mode: true
      register: base_ansible_user_check
      failed_when: base_ansible_user_check.changed

    - name: Check jlw user exists
      ansible.builtin.user:
        name: jlw
        state: present
      check_mode: true
      register: base_jlw_user_check
      failed_when: base_jlw_user_check.changed

    - name: Check ansible user shell is /bin/bash
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - ansible
      register: base_ansible_shell
      changed_when: false
      failed_when: base_ansible_shell.stdout.split(':')[6] != "/bin/bash"

    - name: Check jlw user shell is /usr/bin/zsh
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - jlw
      register: base_jlw_shell
      changed_when: false
      failed_when: base_jlw_shell.stdout.split(':')[6] != "/usr/bin/zsh"

    - name: Check root user shell is /usr/bin/zsh
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - root
      register: base_root_shell
      changed_when: false
      failed_when: base_root_shell.stdout.split(':')[6] != "/usr/bin/zsh"

    - name: Collect sudoers file metadata
      ansible.builtin.stat:
        path: /etc/sudoers.d/{{ item }}
      register: base_sudoers_stat
      loop:
        - ansible
        - jlw

    - name: Check sudoers files exist with correct mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0440"
      loop: "{{ base_sudoers_stat.results }}"

    - name: Check required packages are installed
      ansible.builtin.package_facts:
        manager: apt
      register: base_package_facts

    - name: Ensure critical packages installed
      ansible.builtin.assert:
        that:
          - "'sudo' in base_package_facts.ansible_facts.packages"
          - "'curl' in base_package_facts.ansible_facts.packages"
          - "'git' in base_package_facts.ansible_facts.packages"
          - "'zsh' in base_package_facts.ansible_facts.packages"
          - "'unattended-upgrades' in base_package_facts.ansible_facts.packages"
          - "'needrestart' in base_package_facts.ansible_facts.packages"
        fail_msg: Critical packages missing from base role installation

    - name: Collect unattended-upgrades config metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      register: base_unattended_stat
      loop:
        - /etc/apt/apt.conf.d/20auto-upgrades
        - /etc/apt/apt.conf.d/50unattended-upgrades

    - name: Check unattended-upgrades config files exist
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ base_unattended_stat.results }}"

    - name: Check sshd hardening config exists and has PasswordAuthentication no
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - PasswordAuthentication no
          - /etc/ssh/sshd_config.d/99-hardening.conf
      register: base_sshd_hardening
      changed_when: false
      failed_when: base_sshd_hardening.rc != 0

    - name: Check host keys regenerated marker exists
      ansible.builtin.stat:
        path: /etc/ssh/.base-host-keys-regenerated
      register: base_host_keys_marker
      failed_when: not base_host_keys_marker.stat.exists

    - name: Check journald drop-in exists
      ansible.builtin.stat:
        path: /etc/systemd/journald.conf.d/99-base-retention.conf
      register: base_journald_dropin
      failed_when: not base_journald_dropin.stat.exists

    - name: Check update-motd.d banner exists and is executable
      ansible.builtin.stat:
        path: /etc/update-motd.d/10-banner
      register: base_motd_banner
      failed_when: not base_motd_banner.stat.exists or not base_motd_banner.stat.executable

    - name: Collect autologin override metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      register: base_autologin_stat
      loop:
        - /etc/systemd/system/container-getty@.service.d/override.conf
        - /etc/systemd/system/console-getty.service.d/override.conf

    - name: Check autologin overrides exist
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ base_autologin_stat.results }}"

    - name: Check logrotate.conf has rotate 4
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - ^rotate 4
          - /etc/logrotate.conf
      register: base_logrotate_check
      changed_when: false
      failed_when: base_logrotate_check.rc != 0
