---
# Everything steady-state management depends on: the ansible user with
# passwordless sudo, plus any personal accounts in base_extra_sudo_users
# (same treatment - user + passwordless sudo, nothing more). Bootstrap
# imports exactly this file (import_role tasks_from: users) so a fresh
# container can hand off to workloads.yaml; keep it free of anything
# beyond that contract - shells are handled separately in shells.yml
# because zsh isn't installed yet when bootstrap runs this.
#
# No SSH keys are installed for any of these accounts, on purpose:
# Tailscale SSH is the only supported remote-access path, with the Proxmox
# console (see roles/base/tasks/autologin.yml) as the fallback. Plain sshd
# stays key-only and reachable over the tailnet - see roles/base/tasks/ssh.yml.

- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create sudo-enabled accounts
  ansible.builtin.user:
    name: "{{ item }}"
    create_home: true
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"

- name: Grant sudo-enabled accounts passwordless sudo
  ansible.builtin.copy:
    content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"
