---
# Create sudoers and set shell preferences. The ansible user and any
# base_extra_sudo_users get passwordless sudo. No SSH keys are installed
# on purpose: Tailscale SSH is the only supported remote-access path.

- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create sudo-enabled accounts
  ansible.builtin.user:
    name: "{{ item }}"
    create_home: true
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"

- name: Grant sudo-enabled accounts passwordless sudo
  ansible.builtin.copy:
    content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"

- name: Set the ansible account's shell
  ansible.builtin.user:
    name: "{{ base_ansible_user }}"
    shell: "{{ base_user_shells[base_ansible_user] | default('/bin/bash') }}"

- name: Set extra sudo accounts' shells
  ansible.builtin.user:
    name: "{{ item }}"
    shell: "{{ base_user_shells[item] | default('/bin/bash') }}"
  loop: "{{ base_extra_sudo_users }}"

- name: Set root's shell
  ansible.builtin.user:
    name: root
    shell: "{{ base_user_shells['root'] | default('/bin/bash') }}"
