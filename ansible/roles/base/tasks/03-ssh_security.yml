---
# Enforce key-only SSH and regenerate host keys on cloned containers.

- name: Check whether SSH host keys have already been regenerated
  ansible.builtin.stat:
    path: /etc/ssh/.base-host-keys-regenerated
  register: base_host_keys_marker

- name: Regenerate SSH host keys if this is a cloned container
  when: not base_host_keys_marker.stat.exists
  block:
    - name: Find existing SSH host key files
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key*"
      register: base_host_key_files

    - name: Remove existing SSH host keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ base_host_key_files.files }}"

    - name: Generate new SSH host keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -A
      changed_when: true

    - name: Restart sshd to load the new host keys
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Record that host keys have been regenerated
      ansible.builtin.copy:
        content: "Host keys regenerated by roles/base on {{ ansible_facts['date_time']['iso8601'] }}\n"
        dest: /etc/ssh/.base-host-keys-regenerated
        owner: root
        group: root
        mode: "0644"

- name: Ensure sshd's privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Own the sshd hardening drop-in
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/base). Do not edit by hand.
      PasswordAuthentication no
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  register: base_sshd_config
  notify: Restart sshd

- name: Validate the merged sshd configuration  # noqa no-handler
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  when: base_sshd_config.changed
  changed_when: false
