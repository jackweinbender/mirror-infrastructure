---
# Root auto-login on the container console (the Proxmox web UI's xterm.js /
# noVNC console - not SSH). Tradeoff, accepted deliberately: anyone with
# Proxmox GUI access gets a passwordless root shell, and GUI access is
# already restricted to trusted admins.
#
# Debian LXCs serve the console from container-getty@.service (pts/N, the
# Proxmox default) or console-getty.service (/dev/console). Install
# overrides for both - a drop-in for an unused unit is inert - and restart
# whichever is actually running.

- name: Ensure getty override directories exist
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ base_autologin_gettys }}"

- name: Configure root auto-login overrides
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/override.conf"
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud {{ item.tty }} 115200,38400,9600 $TERM
    owner: root
    group: root
    mode: "0644"
  loop: "{{ base_autologin_gettys }}"
  register: base_autologin_overrides

- name: Restart running getty units to apply auto-login
  ansible.builtin.command:
    argv:
      - systemctl
      - try-restart
      - console-getty.service
      - container-getty@*.service
  when: base_autologin_overrides.changed
  changed_when: true
