---
# Automatically restarts services after unattended-upgrades patches their
# binaries or libraries, so a security update actually takes effect instead
# of silently sitting unapplied until someone happens to reboot.

- name: Install needrestart
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Configure needrestart to automatically restart services
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/base). Do not edit by hand.
      $nrconf{restart} = 'a';
    dest: /etc/needrestart/conf.d/99-base-auto-restart.conf
    owner: root
    group: root
    mode: "0644"
