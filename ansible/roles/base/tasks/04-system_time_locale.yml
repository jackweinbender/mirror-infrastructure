---
# Configure locale, timezone, and NTP time synchronization.

- name: Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present

- name: Generate the configured locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present

- name: Set the default system locale
  ansible.builtin.copy:
    content: |
      LANG={{ base_locale }}
      LANGUAGE={{ base_locale }}
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"

- name: Read the current timezone and NTP sync status
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - -p
      - Timezone
      - -p
      - NTP
      - --value
  register: base_time_status
  changed_when: false

- name: Set the timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ base_timezone }}"
  when: base_time_status.stdout_lines[0] != base_timezone
  changed_when: true

- name: Enable NTP time synchronization
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-ntp
      - "true"
  when: base_time_status.stdout_lines[1] != 'yes'
  changed_when: true
