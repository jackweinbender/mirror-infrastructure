---
- name: Require a Debian or Ubuntu host
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: >-
      Vector's apt.vector.dev repository supports Debian and Ubuntu (detected
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_release'] }}
      on {{ inventory_hostname }}).

- name: Ensure prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
      - python3-debian
    state: present

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the Vector key directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings/vector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Datadog archive signing keys for the Vector repo
  ansible.builtin.get_url:
    url: "https://keys.datadoghq.com/{{ item }}"
    dest: "/etc/apt/keyrings/vector/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - DATADOG_APT_KEY_CURRENT.public
    - DATADOG_APT_KEY_F14F620E.public
    - DATADOG_APT_KEY_C0962C7D.public

- name: Assemble the Vector repository keyring
  ansible.builtin.assemble:
    src: /etc/apt/keyrings/vector
    dest: /etc/apt/keyrings/vector.asc
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/gpg --dearmor --output /dev/null %s

- name: Add Vector's apt repository
  ansible.builtin.deb822_repository:
    name: vector
    types: deb
    uris: https://apt.vector.dev/
    suites: "{{ base_vector_apt_suite }}"
    components:
      - "{{ base_vector_apt_component }}"
    signed_by: /etc/apt/keyrings/vector.asc

- name: Install Vector (apt package - current stable)
  ansible.builtin.apt:
    name: vector
    state: present
    update_cache: true
