---
# Guards against duplicate SSH host keys when containers are cloned from a
# shared Proxmox template (a real security defect - breaks host-key
# pinning, is a latent impersonation risk between containers). Regenerates
# once per host, gated on a marker file so subsequent runs are a no-op and
# known_hosts entries don't keep breaking.

- name: Check whether SSH host keys have already been regenerated
  ansible.builtin.stat:
    path: /etc/ssh/.base-host-keys-regenerated
  register: base_host_keys_marker

- name: Regenerate SSH host keys
  when: not base_host_keys_marker.stat.exists
  block:
    - name: Find existing SSH host key files
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key*"
      register: base_host_key_files

    - name: Remove existing SSH host keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ base_host_key_files.files }}"

    - name: Generate new SSH host keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -A
      changed_when: true

    - name: Restart sshd to load the new host keys
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Record that host keys have been regenerated
      ansible.builtin.copy:
        content: "Host keys regenerated by roles/base on {{ ansible_date_time.iso8601 }}\n"
        dest: /etc/ssh/.base-host-keys-regenerated
        owner: root
        group: root
        mode: "0644"
