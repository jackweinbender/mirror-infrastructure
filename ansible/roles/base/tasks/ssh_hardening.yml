---
# Only affects plain sshd. Tailscale SSH (tailscaled's own SSH
# implementation, bound to the tailscale0 interface) does not go through
# sshd or this config at all, and stays reachable regardless.

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    line: "PasswordAuthentication {{ 'yes' if base_ssh_password_authentication else 'no' }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  register: base_sshd_config

- name: Reload sshd to apply the change
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  when: base_sshd_config.changed
