---
# base role: baseline provisioning for Debian workloads on a Tailscale-only
# network (never internet-exposed). Kept intentionally minimal - no
# firewall/sysctl/fail2ban, since Tailscale ACLs are the real perimeter and
# those controls mostly guard against threats these hosts don't face while
# adding real operational risk (unprivileged-LXC sysctl/nft friction,
# lockout risk) for little benefit here.

base_upgrade_packages: true
base_ansible_user: ansible
base_github_user: jackweinbender

# Tailscale gating (consumed by roles/tailscale)
base_install_tailscale: true
base_tailscale_authkey: ""

# SSH: disable password auth only. Root login is left at Debian's default
# (prohibit-password) rather than hard-disabled - Tailscale ACLs already
# gate who can reach sshd at all.
base_ssh_password_authentication: false

base_enable_unattended_upgrades: true
