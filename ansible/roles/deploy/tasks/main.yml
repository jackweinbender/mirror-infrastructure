---
- name: Inspect whether the c5e credential is initialized
  ansible.builtin.stat:
    path: "{{ secrets_c5e_environment_file }}"
    follow: false
  register: deploy_c5e_environment
  no_log: true

- name: Skip c5e until the secrets capability initializes its credential
  ansible.builtin.debug:
    msg: Run playbooks/c5e-reconciler.yaml with --limit <host> once per host to initialize c5e credentials.
  when: not (deploy_c5e_environment.stat.isreg | default(false))

- name: Configure c5e when its credential exists
  when: deploy_c5e_environment.stat.isreg | default(false)
  block:
    - name: Resolve and validate proxy-network migration approval
      ansible.builtin.import_tasks: proxy_migration.yml

    - name: Prepare the c5e application
      ansible.builtin.import_tasks: prepare.yml

    - name: Stop any existing c5e Compose controller
      ansible.builtin.import_tasks: retire_compose.yml

    - name: Install and start the c5e systemd controller
      ansible.builtin.import_tasks: install.yml
