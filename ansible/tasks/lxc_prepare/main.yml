---
- name: Include LXC prepare variables
  ansible.builtin.include_vars: vars.yml

- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - lxc_prepare_ctid is defined
    fail_msg: >-
      lxc_prepare_ctid is required, e.g. pass
      --extra-vars lxc_prepare_ctid=105

- name: Check if LXC container exists
  ansible.builtin.command:
    argv:
      - pct
      - config
      - "{{ lxc_prepare_ctid }}"
  register: lxc_prepare_ctid_check
  failed_when: false
  changed_when: false

- name: Fail if container does not exist
  ansible.builtin.fail:
    msg: "Container {{ lxc_prepare_ctid }} does not exist on this Proxmox node"
  when: lxc_prepare_ctid_check.rc != 0

- name: Wait for the container to accept pct exec
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_prepare_ctid }}"
      - --
      - "true"
  register: lxc_prepare_exec_check
  until: lxc_prepare_exec_check.rc == 0
  retries: 10
  delay: 5
  changed_when: false

- name: Add the TUN device if missing
  when:
    - lxc_prepare_enable_tun | default(true)
    - "'/dev/net/tun' not in lxc_prepare_ctid_check.stdout"
  block:
    - name: Find assigned container device slots
      ansible.builtin.set_fact:
        lxc_prepare_used_device_slots: >-
          {{
            lxc_prepare_ctid_check.stdout_lines
            | select('match', '^dev[0-9]+:')
            | map('regex_replace', ':.*$', '')
            | list
          }}

    - name: Find available container device slots
      ansible.builtin.set_fact:
        lxc_prepare_available_device_slots: >-
          {{
            range(0, 256)
            | map('string')
            | map('regex_replace', '^', 'dev')
            | difference(lxc_prepare_used_device_slots)
            | sort
            | list
          }}

    - name: Assert a container device slot is available
      ansible.builtin.assert:
        that:
          - lxc_prepare_available_device_slots | length > 0
        fail_msg: "Container {{ lxc_prepare_ctid }} has no free device slots"

    - name: Enable TUN/TAP for container
      ansible.builtin.command:
        argv:
          - pct
          - set
          - "{{ lxc_prepare_ctid }}"
          - "--{{ lxc_prepare_available_device_slots | first }}"
          - "path=/dev/net/tun"
      register: lxc_prepare_tun_config
      changed_when: true

    - name: Mark that a reboot is required after enabling TUN
      ansible.builtin.set_fact:
        lxc_prepare_reboot_required: true
      when: lxc_prepare_tun_config.changed

# Docker needs two Proxmox-level LXC feature flags (nesting, keyctl) that
# only take effect from the host side - see roles/docker/tasks/preflight.yml
# for why they can't be set from inside the guest. Only enabled when the
# caller actually intends to run Docker on this container (lxc_bootstrap
# prompts for this) - most containers don't need the extra privileges, and
# there's no reason to grant them by default (see AGENTS.md).
- name: Enable Docker LXC features if requested
  when: lxc_prepare_enable_docker | default(false)
  vars:
    lxc_prepare_features_line: >-
      {{ lxc_prepare_ctid_check.stdout_lines | select('match', '^features:') | list | first | default('features:') }}
    lxc_prepare_features_list: "{{ lxc_prepare_features_line.split(':', 1)[1].strip().split(',') | reject('equalto', '') | list }}"
    lxc_prepare_docker_flags: ["nesting=1", "keyctl=1"]
    lxc_prepare_features_missing: "{{ lxc_prepare_docker_flags | reject('in', lxc_prepare_features_list) | list }}"
  block:
    - name: Enable nesting and keyctl for Docker
      ansible.builtin.command:
        argv:
          - pct
          - set
          - "{{ lxc_prepare_ctid }}"
          - --features
          - "{{ (lxc_prepare_features_list + lxc_prepare_features_missing) | join(',') }}"
      when: lxc_prepare_features_missing | length > 0
      register: lxc_prepare_docker_features_config
      changed_when: true

    - name: Mark that a reboot is required after enabling Docker features
      ansible.builtin.set_fact:
        lxc_prepare_reboot_required: true
      when: lxc_prepare_docker_features_config.changed | default(false)

- name: Apply LXC config changes
  when: lxc_prepare_reboot_required | default(false)
  block:
    - name: Reboot the container to apply LXC config changes
      ansible.builtin.command:
        argv:
          - pct
          - reboot
          - "{{ lxc_prepare_ctid }}"
      changed_when: true

    - name: Wait for the container to accept pct exec after reboot
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_prepare_ctid }}"
          - --
          - "true"
      register: lxc_prepare_exec_check_post_reboot
      until: lxc_prepare_exec_check_post_reboot.rc == 0
      retries: 10
      delay: 5
      changed_when: false

- name: Get the container's IP address
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_prepare_ctid }}"
      - --
      - hostname
      - -I
  register: lxc_prepare_ip_result
  changed_when: false
  until: lxc_prepare_ip_result.stdout | trim | length > 0
  retries: 10
  delay: 5

- name: Add the container to in-memory inventory for the next play
  ansible.builtin.add_host:
    name: "lxc-{{ lxc_prepare_ctid }}"
    ansible_host: "{{ lxc_prepare_ip_result.stdout.split()[0] }}"
    ansible_user: root
    groups:
      - lxc_new
  changed_when: false
