---
- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - lxc_prepare_ctid is defined
    fail_msg: >-
      lxc_prepare_ctid is required, e.g. pass
      --extra-vars lxc_prepare_ctid=105

- name: Check if LXC container exists
  ansible.builtin.command:
    argv:
      - pct
      - config
      - "{{ lxc_prepare_ctid }}"
  register: lxc_prepare_ctid_check
  failed_when: false
  changed_when: false

- name: Fail if container does not exist
  ansible.builtin.fail:
    msg: Container {{ lxc_prepare_ctid }} does not exist on this Proxmox node
  when: lxc_prepare_ctid_check.rc != 0

- name: Wait for the container to accept pct exec
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_prepare_ctid }}"
      - --
      - "true"
  register: lxc_prepare_exec_check
  until: lxc_prepare_exec_check.rc == 0
  retries: 10
  delay: 5
  changed_when: false

- name: Add Tailscale support (TUN/TAP device) if requested
  vars:
    lxc_features_ctid: "{{ lxc_prepare_ctid }}"
    lxc_features_enable_tailscale: true
  ansible.builtin.import_tasks: ../lxc_features/add_tailscale.yml

- name: Add Docker features if requested
  when: lxc_prepare_enable_docker | default(false)
  vars:
    lxc_features_ctid: "{{ lxc_prepare_ctid }}"
    lxc_features_enable_docker: true
  ansible.builtin.import_tasks: ../lxc_features/add_docker.yml

- name: Apply LXC config changes
  when: lxc_features_reboot_required | default(false)
  vars:
    lxc_features_ctid: "{{ lxc_prepare_ctid }}"
  ansible.builtin.import_tasks: ../lxc_features/reboot.yml

- name: Get the container's IP address (after any reboots)
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_prepare_ctid }}"
      - --
      - hostname
      - -I
  register: lxc_prepare_ip_result
  changed_when: false
  until: lxc_prepare_ip_result.stdout | trim | length > 0
  retries: 10
  delay: 5

- name: Add the container to in-memory inventory for the next play
  ansible.builtin.add_host:
    name: lxc-{{ lxc_prepare_ctid }}
    ansible_host: "{{ lxc_prepare_ip_result.stdout.split()[0] }}"
    ansible_user: root
    groups:
      - lxc_new
  changed_when: false
