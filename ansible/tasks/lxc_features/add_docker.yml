- name: Add Docker LXC features
  block:
    - name: Get container configuration
      ansible.builtin.command:
        argv:
          - pct
          - config
          - "{{ lxc_features_ctid }}"
      register: lxc_features_docker_config
      changed_when: false

    - name: Parse Docker features
      vars:
        lxc_features_features_line: >-
          {{ lxc_features_docker_config.stdout_lines | select('match', '^features:') | list | first | default('features:') }}
        lxc_features_features_list: "{{ lxc_features_features_line.split(':', 1)[1].strip().split(',') | reject('equalto', '') | list }}"
        lxc_features_docker_flags: ["nesting=1", "keyctl=1"]
        lxc_features_docker_missing: "{{ lxc_features_docker_flags | reject('in', lxc_features_features_list) | list }}"
      block:
        - name: Skip Docker features if already present
          ansible.builtin.debug:
            msg: "Docker features (nesting, keyctl) already present on container {{ lxc_features_ctid }}"
          when: lxc_features_docker_missing | length == 0

        - name: Enable nesting and keyctl for Docker
          when: lxc_features_docker_missing | length > 0
          block:
            - name: Set Docker feature flags
              ansible.builtin.command:
                argv:
                  - pct
                  - set
                  - "{{ lxc_features_ctid }}"
                  - --features
                  - "{{ (lxc_features_features_list + lxc_features_docker_missing) | join(',') }}"
              register: lxc_features_docker_result
              changed_when: true

            - name: Mark that container reboot is required
              ansible.builtin.set_fact:
                lxc_features_reboot_required: true
