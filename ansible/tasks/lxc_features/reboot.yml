- name: Reboot the container if features were added
  ansible.builtin.command:
    argv:
      - pct
      - reboot
      - "{{ lxc_features_ctid }}"
  when: lxc_features_reboot_required | default(false)
  changed_when: true

- name: Wait for the container to come back after reboot
  when: lxc_features_reboot_required | default(false)
  block:
    - name: Wait for container to accept pct exec
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_features_ctid }}"
          - --
          - "true"
      register: lxc_reboot_exec_check
      until: lxc_reboot_exec_check.rc == 0
      retries: 10
      delay: 5
      changed_when: false
