- name: Require a Debian guest
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
    fail_msg: >
      Bootstrap supports Debian guests only; {{ inventory_hostname }} reports
      {{ ansible_facts['distribution'] }}.

- name: Require a Tailscale auth key
  ansible.builtin.assert:
    that:
      - lxc_bootstrap_tailscale_authkey | default('') | length > 0
    fail_msg: >-
      lxc_bootstrap_tailscale_authkey is required: bootstrap's job is to put
      the container on the tailnet so workloads.yaml can manage it.

- name: Wait for outbound network connectivity
  ansible.builtin.uri:
    url: https://tailscale.com
    method: HEAD
    status_code: [200, 301, 302]
  register: lxc_bootstrap_network
  until: lxc_bootstrap_network.status in [200, 301, 302]
  retries: 12
  delay: 5
  changed_when: false

- name: Create the management user steady state connects as
  ansible.builtin.import_tasks: ../roles/base/tasks/sudo_users.yml

- name: Install Tailscale and join the tailnet
  ansible.builtin.import_role:
    name: tailscale
  vars:
    tailscale_authkey: "{{ lxc_bootstrap_tailscale_authkey }}"

- name: Require a tailnet hostname for inventory registration
  ansible.builtin.assert:
    that:
      - tailscale_hostname | default('') | length > 0
    fail_msg: Tailscale did not report a hostname for the container.

- name: Read the current inventory
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../inventory.yaml"
  register: lxc_bootstrap_inventory_raw
  delegate_to: localhost

- name: Register the host under the workloads group
  vars:
    lxc_bootstrap_inventory: "{{ lxc_bootstrap_inventory_raw.content | b64decode | from_yaml }}"
    # Preserve whatever vars (e.g. host_roles) an already-registered host
    # already has; only a brand-new host gets `null`, or {host_roles:
    # [docker]} if lxc_bootstrap_enable_docker was requested. Re-bootstrapping
    # an existing host must not silently erase its host_roles.
    lxc_bootstrap_default_host_vars: >-
      {{ {'host_roles': ['docker']} if (lxc_bootstrap_enable_docker | default(false)) else none }}
    lxc_bootstrap_existing_host_vars: >-
      {{ lxc_bootstrap_inventory.workloads.hosts[tailscale_hostname] | default(lxc_bootstrap_default_host_vars) }}
  ansible.builtin.copy:
    content: >-
      {{
        lxc_bootstrap_inventory
        | combine({'workloads': {'hosts': {tailscale_hostname: lxc_bootstrap_existing_host_vars}}}, recursive=true)
        | to_nice_yaml(indent=2, sort_keys=false)
      }}
    dest: "{{ playbook_dir }}/../inventory.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Print the handoff summary
  ansible.builtin.debug:
    msg: >-
      {{ tailscale_hostname }} is on the tailnet (Tailscale SSH enabled) and
      registered in ansible/inventory.yaml under workloads. Run
      workloads.yaml to apply the full baseline. Tailscale SSH is the only
      supported remote-access path; if it's ever unreachable, use the
      Proxmox console (root, no password) as the fallback.
