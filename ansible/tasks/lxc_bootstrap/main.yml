---
- name: Include LXC bootstrap variables
  ansible.builtin.include_vars: vars.yml

- name: Map LXC bootstrap variables to common role variables
  ansible.builtin.set_fact:
    common_upgrade_packages: "{{ lxc_bootstrap_upgrade_packages }}"
    common_ansible_user: "{{ lxc_bootstrap_ansible_user }}"
    common_github_user: "{{ lxc_bootstrap_github_user }}"
    common_install_tailscale: "{{ lxc_bootstrap_install_tailscale }}"
    common_tailscale_authkey: "{{ lxc_bootstrap_tailscale_authkey }}"

- name: Wait for outbound network connectivity
  ansible.builtin.uri:
    url: https://github.com
    method: HEAD
    status_code:
      - 200
      - 301
      - 302
  register: lxc_bootstrap_network_check
  until: lxc_bootstrap_network_check.status is defined and lxc_bootstrap_network_check.status in [200, 301, 302]
  retries: 12
  delay: 5
  changed_when: false

# Apply common configuration using the common role
- name: Include common server configuration
  ansible.builtin.import_role:
    name: common
  when: ansible_facts['os_family'] == 'Debian' # Example condition, adjust as needed

# Console auto-login configuration remains here as it's a provisioning step
- name: Determine which getty unit serves the console (systemd)
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item }}"
  loop:
    - getty@service
    - console-getty.service
  register: lxc_bootstrap_getty_check
  failed_when: false
  changed_when: false
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - ansible_facts['os_family'] == 'Debian'

- name: Select the active getty unit
  ansible.builtin.set_fact:
    lxc_bootstrap_getty_unit: >-
      {{ (lxc_bootstrap_getty_check.results | selectattr('stdout', 'equalto', 'active') | map(attribute='item') | list | first) }}
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - ansible_facts['os_family'] == 'Debian'
    - lxc_bootstrap_getty_check.results | selectattr('stdout', 'equalto', 'active') | list | length > 0

- name: Warn if no active getty unit was found
  ansible.builtin.debug:
    msg: >-
      lxc_bootstrap_console_autologin is true but no known getty unit
      (getty@service, console-getty, getty@tty1) is active on
      {{ inventory_hostname }}. Skipping console auto-login setup - check
      `systemctl list-units | grep getty` on the host manually.
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - ansible_facts['os_family'] == 'Debian'
    - lxc_bootstrap_getty_unit is not defined

- name: Ensure the getty override directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ lxc_bootstrap_getty_unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - lxc_bootstrap_getty_unit is defined

- name: Configure console auto-login for root (systemd)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ lxc_bootstrap_getty_unit }}.d/override.conf"
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud pts/%I 115200,38400,9600 $TERM
    owner: root
    group: root
    mode: "0644"
  register: lxc_bootstrap_getty_override
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - lxc_bootstrap_getty_unit is defined

- name: Reload systemd and restart the getty unit
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ lxc_bootstrap_getty_unit }}"
    state: restarted
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - lxc_bootstrap_getty_unit is defined
    - lxc_bootstrap_getty_override.changed

- name: Configure console auto-login for root (Alpine)
  ansible.builtin.replace:
    path: /etc/inittab
    regexp: '^(tty1::respawn:)/sbin/getty.*$'
    replace: '\1/sbin/getty -n -l /bin/login -a root 38400 tty1'
  register: lxc_bootstrap_inittab
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - ansible_facts['os_family'] == 'Alpine'

- name: Reload inittab (Alpine)
  ansible.builtin.command:
    argv:
      - kill
      - -HUP
      - "1"
  changed_when: true
  when:
    - lxc_bootstrap_console_autologin | default(true)
    - ansible_facts['os_family'] == 'Alpine'
    - lxc_bootstrap_inittab.changed

# Tailscale installation and configuration is now part of the tailscale role
# Apply tailscale configuration if configured
- name: Require Tailscale configuration
  ansible.builtin.assert:
    that:
      - common_install_tailscale | bool
      - common_tailscale_authkey | length > 0
    fail_msg: >-
      LXC bootstrap requires Tailscale and a non-empty
      lxc_bootstrap_tailscale_authkey so the container can be added to inventory.

- name: Include Tailscale configuration
  ansible.builtin.import_role:
    name: tailscale

- name: Require a Tailscale hostname
  ansible.builtin.assert:
    that:
      - tailscale_hostname is defined
      - tailscale_hostname | length > 0
    fail_msg: Tailscale did not return a hostname for the container.

# Inventory management tasks are specific to the bootstrap process for adding new hosts
# These should remain in the bootstrap playbook, not in the common role.
- name: Read the current inventory file
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../inventory.yaml"
  register: lxc_bootstrap_inventory_raw
  delegate_to: localhost

- name: Merge the new host into inventory data
  ansible.builtin.set_fact:
    lxc_bootstrap_inventory_data: >-
      {{
        (lxc_bootstrap_inventory_raw.content | b64decode | from_yaml)
        | combine({
            'lxc': {
              'hosts': {
                tailscale_hostname: {
                  'ansible_host': tailscale_hostname,
                  'ansible_user': common_ansible_user | default('ansible')
                }
              }
            }
          }, recursive=True)
      }}

- name: Write the container into ansible/inventory.yaml
  ansible.builtin.copy:
    content: "{{ lxc_bootstrap_inventory_data | to_nice_yaml(indent=2, sort_keys=False) }}"
    dest: "{{ playbook_dir }}/../inventory.yaml"
    mode: "0644"
  delegate_to: localhost

# Print next steps - these can remain in the bootstrap playbook as they are specific to the bootstrapping process
- name: Print next steps (joined tailnet)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_host }}) is bootstrapped and
      joined to the tailnet with Tailscale SSH enabled as
      {{ tailscale_hostname | default('<pending - check `tailscale status` on the host>') }}.
      Connect as {{ common_ansible_user | default('ansible') }}@{{ tailscale_hostname | default('<tailscale-hostname>') }}
      via `tailscale ssh` (or plain `ssh` once Tailscale SSH access is
      configured) - it has no local authorized_keys, so plain SSH from
      outside the tailnet won't reach it. root@{{ ansible_host }} remains
      reachable via your GitHub key over plain SSH.
      {{ tailscale_hostname | default(inventory_hostname) }}
      has been added to ansible/inventory.yaml under the `lxc` group
      automatically.
  changed_when: false
