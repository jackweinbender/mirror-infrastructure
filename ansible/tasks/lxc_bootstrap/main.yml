---
# Bootstrap: the minimum to hand a fresh Debian LXC over to steady state
# (workloads.yaml). Creates the management user, joins the tailnet, and
# registers the host in inventory. Everything else - package upgrades, sshd
# policy, unattended-upgrades, console auto-login - is desired-state config
# owned by the base role and applied on the first steady-state run.

- name: Require a Debian guest
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      Bootstrap supports Debian guests only; {{ inventory_hostname }} reports
      {{ ansible_facts['os_family'] }}.

- name: Require a Tailscale auth key
  ansible.builtin.assert:
    that:
      - lxc_bootstrap_tailscale_authkey | default('') | length > 0
    fail_msg: >-
      lxc_bootstrap_tailscale_authkey is required: bootstrap's job is to put
      the container on the tailnet so workloads.yaml can manage it.

- name: Wait for outbound network connectivity
  ansible.builtin.uri:
    url: https://github.com
    method: HEAD
    status_code: [200, 301, 302]
  register: lxc_bootstrap_network
  until: lxc_bootstrap_network.status in [200, 301, 302]
  retries: 12
  delay: 5
  changed_when: false

- name: Create the management user steady state connects as
  ansible.builtin.import_role:
    name: base
    tasks_from: users

- name: Install Tailscale and join the tailnet
  ansible.builtin.import_role:
    name: tailscale
  vars:
    tailscale_authkey: "{{ lxc_bootstrap_tailscale_authkey }}"

- name: Require a tailnet hostname for inventory registration
  ansible.builtin.assert:
    that:
      - tailscale_hostname | default('') | length > 0
    fail_msg: Tailscale did not report a hostname for the container.

- name: Read the current inventory
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../inventory.yaml"
  register: lxc_bootstrap_inventory_raw
  delegate_to: localhost

- name: Register the host under the workloads group
  ansible.builtin.copy:
    content: >-
      {{
        lxc_bootstrap_inventory_raw.content | b64decode | from_yaml
        | combine({'workloads': {'hosts': {tailscale_hostname: none}}}, recursive=true)
        | to_nice_yaml(indent=2, sort_keys=false)
      }}
    dest: "{{ playbook_dir }}/../inventory.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Print the handoff summary
  ansible.builtin.debug:
    msg: >-
      {{ tailscale_hostname }} is on the tailnet (Tailscale SSH enabled) and
      registered in ansible/inventory.yaml under workloads. Run
      workloads.yaml to apply the full baseline. Root remains reachable at
      {{ ansible_host }} over plain SSH via your GitHub keys.
