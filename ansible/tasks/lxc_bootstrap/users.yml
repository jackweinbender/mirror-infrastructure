---
# Bare minimum for bootstrap: create the management user that steady state
# will login as. Shells are configured in the base role after packages are
# installed (zsh doesn't exist yet). No SSH keys or passwords.

- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create sudo-enabled accounts
  ansible.builtin.user:
    name: "{{ item }}"
    create_home: true
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"

- name: Grant sudo-enabled accounts passwordless sudo
  ansible.builtin.copy:
    content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ [base_ansible_user] + base_extra_sudo_users }}"
