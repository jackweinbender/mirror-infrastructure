---
# Creates a new LXC container on Proxmox
# Required variables:
#   lxc_create_ctid: Container ID to create
#   lxc_create_hostname: Hostname for the container
#   lxc_create_cores: Number of CPU cores
#   lxc_create_memory: Memory in MB
#   lxc_create_storage: Storage location (e.g., local-lvm)
#   lxc_create_template: Template to use (e.g., debian-12-standard)
#   lxc_create_ssh_pubkey: SSH public key to add to root
# Optional variables:
#   lxc_create_bridge: Network bridge (default: vmbr0)
#   lxc_create_features: LXC features to enable (default: nesting=1,keyctl=1 for Docker)


- name: Validate required variables
  ansible.builtin.assert:
    that:
      - lxc_create_ctid is defined
      - lxc_create_hostname is defined
      - lxc_create_cores is defined
      - lxc_create_memory is defined
      - lxc_create_storage is defined
      - lxc_create_template is defined
      - lxc_create_ssh_pubkey is defined
    fail_msg: >-
      One or more required variables missing:
      lxc_create_ctid, lxc_create_hostname, lxc_create_cores, lxc_create_memory,
      lxc_create_storage, lxc_create_template, lxc_create_ssh_pubkey

- name: Check if LXC container already exists cluster-wide
  ansible.builtin.raw: "grep -r 'vmid: {{ lxc_create_ctid }}' /etc/pve/nodes/ 2>/dev/null || true"
  register: lxc_create_ctid_search
  changed_when: false
  failed_when: false

- name: Determine which node the container exists on (if any)
  ansible.builtin.set_fact:
    lxc_create_ctid_node: "{{ (lxc_create_ctid_search.stdout.split('/')[4] if lxc_create_ctid_search.stdout else '') }}"
  when: lxc_create_ctid_search.stdout | length > 0

- name: Fail if container already exists on any node
  ansible.builtin.fail:
    msg: "Container {{ lxc_create_ctid }} already exists on node {{ lxc_create_ctid_node }} (Proxmox cluster-wide IDs must be unique)"
  when: lxc_create_ctid_search.stdout | length > 0

- name: Extract base template name (without version info)
  ansible.builtin.set_fact:
    lxc_create_template_base: "{{ lxc_create_template.split('_')[0] }}"

- name: Check if template file exists in cache
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ lxc_create_template }}.tar.zst"
  register: lxc_create_template_file

- name: Download the container template if not present
  ansible.builtin.command:
    argv:
      - pveam
      - download
      - "local"
      - "{{ lxc_create_template_base }}"
  register: lxc_create_template_download
  failed_when: lxc_create_template_download.rc != 0 and lxc_create_template_download.rc != 255
  changed_when: "'Downloaded' in lxc_create_template_download.stdout"
  when: not lxc_create_template_file.stat.exists

- name: Create the LXC container
  ansible.builtin.command:
    argv:
      - pct
      - create
      - "{{ lxc_create_ctid }}"
      - "/var/lib/vz/template/cache/{{ lxc_create_template }}.tar.zst"
      - --hostname
      - "{{ lxc_create_hostname }}"
      - --cores
      - "{{ lxc_create_cores | string }}"
      - --memory
      - "{{ lxc_create_memory | string }}"
      - --net0
      - "name=eth0,bridge={{ lxc_create_bridge | default('vmbr0') }},ip=dhcp"
      - --rootfs
      - "{{ lxc_create_storage }}:{{ lxc_create_ctid }}"
      - --features
      - "{{ lxc_create_features | default('nesting=1,keyctl=1') }}"
      - --onboot
      - "1"
  register: lxc_create_result
  changed_when: true

- name: Start the container
  ansible.builtin.command:
    argv:
      - pct
      - start
      - "{{ lxc_create_ctid }}"
  register: lxc_create_start
  changed_when: true

- name: Wait for the container to come up and accept pct exec
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_create_ctid }}"
      - --
      - "true"
  register: lxc_create_exec_check
  until: lxc_create_exec_check.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Populate root's authorized_keys with the provided SSH public key
  ansible.builtin.shell:
    cmd: |
      set -e
      pct exec {{ lxc_create_ctid }} -- mkdir -p /root/.ssh
      pct exec {{ lxc_create_ctid }} -- sh -c 'echo "{{ lxc_create_ssh_pubkey }}" > /root/.ssh/authorized_keys'
      pct exec {{ lxc_create_ctid }} -- chmod 700 /root/.ssh
      pct exec {{ lxc_create_ctid }} -- chmod 600 /root/.ssh/authorized_keys
  changed_when: true

- name: Get the container's IP address
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_create_ctid }}"
      - --
      - hostname
      - -I
  register: lxc_create_ip_result
  changed_when: false
  until: lxc_create_ip_result.stdout | trim | length > 0
  retries: 10
  delay: 5

- name: Add the container to in-memory inventory for the next play
  ansible.builtin.add_host:
    name: "lxc-{{ lxc_create_ctid }}"
    ansible_host: "{{ lxc_create_ip_result.stdout.split()[0] }}"
    ansible_user: root
    groups:
      - lxc_new
  changed_when: false

- name: Print creation summary
  ansible.builtin.debug:
    msg: >-
      Container {{ lxc_create_ctid }} ({{ lxc_create_hostname }}) created successfully.
      IP: {{ lxc_create_ip_result.stdout.split()[0] }}
