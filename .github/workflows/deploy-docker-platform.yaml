---
name: Deploy Docker host platform

on:
  push:
    branches: [main]
    paths:
      - compose-stacks/docker-host/**
      - ansible/inventory.yaml
      - .github/workflows/deploy-docker-platform.yaml
  workflow_dispatch:
    inputs:
      host:
        description: Docker host to deploy (manual runs only)
        required: true
        type: choice
        options:
          - traefik-lxc
          - docker0-lxc
          - docker-vm-dmz
      user:
        description: SSH user with permission to run Docker
        required: false
        default: deploy
        type: string

permissions:
  contents: read

env:
  LOCAL_DIR: compose-stacks/docker-host
  REMOTE_DIR: /etc/compose-stacks/docker-host
  TARGET_USER: "${{ inputs.user || vars.DOCKER_USER || 'deploy' }}"
  ENV_TEMPLATE: compose-stacks/docker-host/.env.template

jobs:
  discover:
    name: Discover deploy hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ansible inventory tool
        run: sudo apt-get update && sudo apt-get install -y ansible-core
      - name: Validate inventory and stacks
        id: hosts
        env:
          HOST_FILTER: ${{ inputs.host || '' }}
        run: node .github/scripts/preflight.mjs

  deploy:
    name: Deploy ${{ matrix.host.id }}
    needs: discover
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    concurrency:
      group: docker-host-${{ matrix.host.id }}
      cancel-in-progress: false
    env:
      TARGET_HOST: ${{ matrix.host.address }}
      REMOTE: "${{ inputs.user || vars.DOCKER_USER || 'deploy' }}@${{ matrix.host.address }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file "$ENV_TEMPLATE" -f "$LOCAL_DIR/docker-compose.yaml" config --quiet

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Load deployment secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONE_PASSWORD_SA_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://network/tailscale-oauth-github-actions/client-id
          TS_OAUTH_CLIENT_SECRET: op://network/tailscale-oauth-github-actions/client-secret

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: 1.76.1

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v3

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Prepare host and proxy network
        run: |
          ssh "$REMOTE" "mkdir -p '$REMOTE_DIR'"
          ssh "$REMOTE" 'docker network inspect proxy >/dev/null 2>&1 || docker network create --driver bridge --attachable proxy'

      - name: Sync host stack
        run: |
          rsync -r --delete --exclude-from="$LOCAL_DIR/.rsyncexclude" \
            "$LOCAL_DIR/" "$REMOTE:$REMOTE_DIR/"

      - name: Inject secrets on host
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONE_PASSWORD_SA_TOKEN }}
        run: |
          set -o pipefail
          op inject -i "$ENV_TEMPLATE" | ssh "$REMOTE" "cat > '$REMOTE_DIR/.env'"

      - name: Reconcile Traefik
        run: |
          ssh "$REMOTE" "cd '$REMOTE_DIR' && if docker compose up --help 2>/dev/null | grep -q -- '--wait'; then docker compose --project-name docker-host --env-file .env up -d --pull always --remove-orphans --wait --wait-timeout 120; else docker compose --project-name docker-host --env-file .env up -d --pull always --remove-orphans; fi"
