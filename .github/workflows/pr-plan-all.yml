---
name: TF Plan

on:
  pull_request:
    paths:
      - terraform/**
      - .github/terraform-components.json
      - .github/workflows/plan-or-apply.yml
      - .github/workflows/pr-plan-all.yml
      - .github/workflows/terraform.yml
      - .github/scripts/terraform-components.rb
      - .github/scripts/validate-terraform-components.rb

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate_components:
    name: Validate Terraform components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate Terraform components
        run: ruby .github/scripts/validate-terraform-components.rb

  changed_components:
    name: Find changed Terraform components
    needs: validate_components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.components }}
      has_changes: ${{ steps.components.outputs.has_changes }}
    steps:
      - name: Checkout PR history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Detect changed components
        id: components
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- terraform/ \
            | ruby .github/scripts/terraform-components.rb >> "$GITHUB_OUTPUT"

  terraform:
    needs: changed_components
    if: needs.changed_components.outputs.has_changes == 'true'
    uses: ./.github/workflows/terraform.yml
    with:
      components: ${{ needs.changed_components.outputs.components }}
      apply: false
      comment: true
    secrets: inherit
