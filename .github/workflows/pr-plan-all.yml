---
name: TF Plan

on:
  pull_request:
    paths:
      - terraform/**

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan-all:
    name: PR Plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    strategy:
      matrix:
        component: [mgmt, aws, gcp-remind-me, gcp-weinbender-io, cloudflare, proxmox]
    steps:
      - uses: actions/checkout@v3
      - name: Auth with AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::325498355308:role/GithubActionsRole
          role-session-name: GithubActionsRole
      - name: Auth with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Plan ${{ matrix.component }}
        uses: ./.github/actions/tf-plan-apply
        with:
          op_token: ${{ secrets.ONE_PASSWORD_SA_TOKEN }}
          component: ${{ matrix.component }}
          apply: "false"
