---
name: Terraform Plan & Apply
description: Terraform plan and apply for a Component / Subdirectory

inputs:
  component:
    description: Component / Subdirectory Name
    required: true
  apply:
    description: Apply the plan as a part of this action?
    default: "false"
  skip_fmt:
    description: Skip terraform fmt?
    default: "false"
  skip_validate:
    description: Skip terraform validate?
    default: "false"
  op_token:
    description: One Password Token

runs:
  using: composite
  steps:
    - name: Load secret
      uses: 1password/load-secrets-action@v2
      with:
        export-env: true
      # We, rather obnoxiously, have to export all OP variables for all
      # runs here, cuz we can't run `op inject` like we do locally
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op_token }}
        TS_OAUTH_CLIENT_ID: op://network/tailscale-oauth-github-actions/client-id
        TS_OAUTH_CLIENT_SECRET: op://network/tailscale-oauth-github-actions/client-secret
        CLOUDFLARE_API_TOKEN: op://network/cloudflare-terraform/credential
        TF_VAR_google_oauth_client_id: op://network/cloudflare-google-oauth/client-id
        TF_VAR_google_oauth_client_secret: op://network/cloudflare-google-oauth/client-secret
        # Proxmox API token — create in 1Password (see this plan's "Manual
        # prerequisites") and update the op:// path if the item/field names differ.
        PROXMOX_VE_API_TOKEN: op://network/proxmox-terraform/api-token
        PROXMOX_VE_ENDPOINT: op://network/proxmox-terraform/endpoint

    - name: Tailscale
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: $TS_OAUTH_CLIENT_ID
        oauth-secret: $TS_OAUTH_CLIENT_SECRET
        tags: tag:ci
        version: 1.76.1
    - uses: hashicorp/setup-terraform@v2
    # We always run init.
    - name: Terraform init
      id: init
      shell: bash
      run: terraform -chdir=terraform/${{ inputs.component }} init

    #  Skippables. Usually we should run them, though.
    - name: Terraform fmt
      if: ${{ inputs.skip_fmt != 'true' }}
      id: fmt
      shell: bash
      run: terraform -chdir=terraform/${{ inputs.component }} fmt -check
    - name: Terraform validate
      if: ${{ inputs.skip_validate != 'true' }}
      id: validate
      shell: bash
      run: terraform -chdir=terraform/${{ inputs.component }} validate

    # We always run plan.
    - name: Terraform plan
      id: plan
      shell: bash
      run: terraform -chdir=terraform/${{ inputs.component }} plan

    # DANGER: Only apply when explicitly instructed.
    - name: Terraform apply
      if: ${{ inputs.apply == 'true' }}
      id: apply
      shell: bash
      run: terraform -chdir=terraform/${{ inputs.component }} apply -auto-approve
