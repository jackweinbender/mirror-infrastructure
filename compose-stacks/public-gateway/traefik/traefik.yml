# Traefik static configuration
# https://doc.traefik.io/traefik/reference/static-configuration/file/

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    # Port 80 is declared but CF never sends HTTP through the tunnel
    # (always_use_https is enforced at the CF edge — see Terraform zone settings).
    # It is here in case of future direct-access needs or health checks.

  websecure:
    address: ":443"
    forwardedHeaders:
      # Trust Cloudflare's IP ranges so apps see the real client IP
      # via X-Forwarded-For / CF-Connecting-IP.
      # Source: https://www.cloudflare.com/ips/
      trustedIPs:
        # IPv4
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "108.162.192.0/18"
        - "131.0.72.0/22"
        - "141.101.64.0/18"
        - "162.158.0.0/15"
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "188.114.96.0/20"
        - "190.93.240.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        # IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "jack@weinbender.io"
      storage: "/etc/traefik/acme/acme.json"
      dnsChallenge:
        provider: cloudflare
        # Wait for DNS propagation before Let's Encrypt verifies
        delayBeforeCheck: 30s
      # Pre-provision the wildcard cert so it's ready before apps are added
      domains:
        - main: "*.weinbender.io"
          sans:
            - "weinbender.io"

providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: "/etc/traefik/dynamic"
    watch: true
