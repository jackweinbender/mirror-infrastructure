---
services:
  planet-express:
    image: git.weinbender.io/labs/planet-express:5a9c1c0df0030cd60f41730b8225fd6045ab66d8
    container_name: planet-express
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/events.db
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - planet_express_data:/data
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.planet-express.rule: Host(`${PLANET_EXPRESS_HOSTNAME}`)
      traefik.http.routers.planet-express.entrypoints: websecure
      traefik.http.routers.planet-express.tls: "true"
      traefik.http.routers.planet-express.tls.certresolver: letsencrypt
      traefik.http.services.planet-express.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  proxy:
    external: true
    name: proxy

volumes:
  planet_express_data:
    name: planet_express_data
