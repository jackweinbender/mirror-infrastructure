---
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    labels:
      vector.app: cloudflared
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: proxy
