# Mosquitto broker for Home Assistant.
# Anonymous access — intentional for a home lab behind Tailscale/NAT.
# To add password auth later: see https://mosquitto.org/man/mosquitto_passwd-1.html

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type all
