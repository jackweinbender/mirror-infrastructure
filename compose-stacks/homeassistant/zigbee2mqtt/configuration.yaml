---
# Zigbee2MQTT configuration.
# See https://www.zigbee2mqtt.io/guide/configuration/

homeassistant:
  enabled: true # Publish MQTT discovery messages for HA auto-discovery

permit_join: true # Allow new devices to join; set to false after initial pairing

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://localhost:1883

serial:
  # Inside the container, the dongle is mapped to /dev/ttyUSB0 via devices: in compose.
  port: /dev/ttyUSB0
  # Set adapter to match your dongle hardware:
  #   ember  — Silicon Labs EFR32/EZSP (e.g. Sonoff Zigbee 3.0 Dongle Plus v2)
  #   zstack — TI CC26x2 (e.g. Sonoff Dongle Plus v1, CC2652P)
  #   deconz — ConBee/RaspBee (Dresden Elektronik)
  #   zboss  — Nordic nRF52840
  #   zigate — ZiGate USB
  adapter: PLACEHOLDER_ADAPTER_TYPE

frontend:
  enabled: true
  port: 8080

advanced:
  homeassistant_legacy_entity_attributes: false
  legacy_api: false
  legacy_availability_payload: false
