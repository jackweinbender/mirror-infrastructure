---
# Host-level Traefik configuration. Application stacks join the external
# `proxy` network and opt in with Docker labels.

log:
  level: INFO

api:
  dashboard: true

entryPoints:
  web:
    address: :80
  websecure:
    address: :443
  paseo:
    address: :6767

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 30s

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true
